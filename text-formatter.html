<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Text Formatter - Nova Power Tools</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:white;
  padding:22px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

header a{
  color:white;
  text-decoration:none;
}

.container{
  max-width:900px;
  margin:50px auto;
  padding:0 20px;
}

.title{
  text-align:center;
  margin-bottom:30px;
}

.title h1{
  font-size:40px;
  margin-bottom:10px;
}

.title span{
  color:#2563eb;
}

.title p{
  color:#667085;
  font-size:17px;
}

.box{
  background:white;
  padding:30px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

textarea{
  width:100%;
  height:300px;
  padding:18px;
  border:1px solid #d0d5dd;
  border-radius:10px;
  resize:vertical;
  font-size:17px;
  outline:none;
  margin-bottom:18px;
}

textarea:focus{
  border-color:#2563eb;
}

.buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

button{
  padding:13px;
  border:none;
  border-radius:9px;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
}

.upper{
  background:#2563eb;
  color:white;
}

.lower{
  background:#7c3aed;
  color:white;
}

.titlecase{
  background:#0891b2;
  color:white;
}

.bold{
  background:#111827;
  color:white;
}

.copy{
  background:#16a34a;
  color:white;
}

.clear{
  background:#ef4444;
  color:white;
}

.home{
  width:100%;
  margin-top:15px;
  background:#e5e7eb;
  color:#172033;
}

footer{
  text-align:center;
  padding:30px;
  margin-top:50px;
  background:#111827;
  color:white;
}

@media(max-width:600px){

  header{
    flex-direction:column;
    gap:12px;
  }

  .title h1{
    font-size:32px;
  }

  .buttons{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">⚡ Nova Power Tools</div>
  <a href="index.html">← Back to Home</a>
</header>

<main class="container">

  <div class="title">
    <h1>📝 <span>Text Formatter</span></h1>
    <p>Format, transform and copy your text easily.</p>
  </div>

  <div class="box">

    <textarea
      id="textInput"
      placeholder="Type or paste your text here..."
    ></textarea>

    <div class="buttons">

      <button class="upper" onclick="makeUppercase()">
        UPPERCASE
      </button>

      <button class="lower" onclick="makeLowercase()">
        lowercase
      </button>

      <button class="titlecase" onclick="makeTitleCase()">
        Title Case
      </button>

      <button class="bold" onclick="makeBold()">
        Bold Text
      </button>

      <button class="copy" onclick="copyText()">
        Copy Text
      </button>

      <button class="clear" onclick="clearText()">
        Clear
      </button>

    </div>

    <button class="home" onclick="goHome()">
      Home
    </button>

  </div>

</main>

<footer>
  <p>© 2026 Nova Power Tools</p>
  <p>Free • Fast • Simple</p>
</footer>

<script>

function getText(){
  return document.getElementById("textInput");
}

function makeUppercase(){
  getText().value =
    getText().value.toUpperCase();
}

function makeLowercase(){
  getText().value =
    getText().value.toLowerCase();
}

function makeTitleCase(){

  getText().value =
    getText().value
    .toLowerCase()
    .replace(/\b\w/g, function(letter){
      return letter.toUpperCase();
    });
}

function makeBold(){

  getText().value =
    getText().value;

  alert("Bold formatting is not supported inside a plain text box. Use the formatted text as needed.");
}

function copyText(){

  const text = getText().value;

  if(text.trim() === ""){
    alert("Nothing to copy.");
    return;
  }

  navigator.clipboard.writeText(text);

  alert("Text copied!");
}

function clearText(){

  getText().value = "";

}

function goHome(){

  window.location.href = "index.html";

}

</script>

</body>
</html>
