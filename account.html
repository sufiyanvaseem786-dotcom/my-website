```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Account - Nova Power Tools</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#eaeded;
  color:#172033;
}

header{
  background:#131921;
  color:white;
  padding:15px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:23px;
  font-weight:bold;
}

.logo span{
  color:#ffb000;
}

header a{
  color:white;
  text-decoration:none;
}

.container{
  max-width:1000px;
  margin:30px auto;
  padding:0 20px;
}

h1{
  margin-bottom:25px;
}

.card{
  background:white;
  padding:25px;
  border-radius:10px;
  margin-bottom:20px;
  box-shadow:0 2px 8px rgba(0,0,0,0.06);
}

.profile{
  display:flex;
  align-items:center;
  gap:20px;
}

.avatar{
  width:75px;
  height:75px;
  border-radius:50%;
  background:#2563eb;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  overflow:hidden;
  flex-shrink:0;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.info h2{
  margin-bottom:8px;
}

.info p{
  color:#667085;
  margin:5px 0;
}

.menu{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.menu a{
  text-decoration:none;
  color:#172033;
  background:#f8fafc;
  padding:20px;
  border-radius:8px;
  border:1px solid #ddd;
  transition:0.2s;
}

.menu a:hover{
  background:#f1f5f9;
  transform:translateY(-2px);
}

.logout{
  margin-top:20px;
  padding:13px 22px;
  border:none;
  border-radius:7px;
  background:#dc2626;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.loading{
  text-align:center;
  padding:50px;
  font-size:18px;
  color:#667085;
}

@media(max-width:600px){

  .menu{
    grid-template-columns:1fr;
  }

  header{
    flex-direction:column;
    gap:10px;
  }

  .profile{
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    ⚡ Nova <span>Power Tools</span>
  </div>

  <a href="index.html">
    ← Home
  </a>

</header>

<div id="loading" class="loading">
  Checking your account...
</div>

<div id="accountPage" class="container" style="display:none;">

  <h1>👤 My Account</h1>

  <div class="card">

    <div class="profile">

      <div class="avatar" id="avatar">
        👤
      </div>

      <div class="info">

        <h2 id="userName">
          Welcome
        </h2>

        <p id="userEmail"></p>

        <p id="userPhone"></p>

      </div>

    </div>

    <button class="logout" id="logoutBtn">
      Logout
    </button>

  </div>


  <div class="card">

    <h2 style="margin-bottom:20px;">
      Quick Access
    </h2>

    <div class="menu">

      <a href="orders.html">
        📦<br>
        <strong>My Orders</strong>
        <br>
        View your orders
      </a>

      <a href="cart.html">
        🛒<br>
        <strong>My Cart</strong>
        <br>
        View items in cart
      </a>

    </div>

  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


const firebaseConfig = {

  apiKey: "AIzaSyAGOZn1c-iWzH3g3OS_TTlh1uz1Ju5gmjw",

  authDomain:
    "nova-power-tools.firebaseapp.com",

  projectId:
    "nova-power-tools",

  storageBucket:
    "nova-power-tools.firebasestorage.app",

  messagingSenderId:
    "265235157417",

  appId:
    "1:265235157417:web:60d630ee374f21b05234b8",

  measurementId:
    "G-PF74PNJQ89"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


const loading =
  document.getElementById("loading");

const accountPage =
  document.getElementById("accountPage");

const userName =
  document.getElementById("userName");

const userEmail =
  document.getElementById("userEmail");

const userPhone =
  document.getElementById("userPhone");

const avatar =
  document.getElementById("avatar");


onAuthStateChanged(auth, function(user){

  if(!user){

    window.location.href = "login.html";

    return;
  }


  loading.style.display = "none";

  accountPage.style.display = "block";


  userName.textContent =
    user.displayName ||
    "Nova Power Tools Customer";


  userEmail.textContent =
    user.email
      ? "📧 " + user.email
      : "";


  userPhone.textContent =
    user.phoneNumber
      ? "📱 " + user.phoneNumber
      : "";


  if(user.photoURL){

    avatar.innerHTML =
      '<img src="' +
      user.photoURL +
      '" alt="Profile">';

  }

});


document
  .getElementById("logoutBtn")
  .addEventListener("click", async function(){

    try{

      await signOut(auth);

      window.location.href =
        "login.html";

    }catch(error){

      alert(
        "Logout failed. Please try again."
      );

      console.error(error);

    }

  });

</script>

</body>
</html>
```
