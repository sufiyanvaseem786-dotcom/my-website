<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart - Nova Power Tools</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#eaeded;
  color:#172033;
}

/* ================= HEADER ================= */

header{
  background:#131921;
  color:white;
  min-height:65px;
  padding:14px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.logo{
  font-size:23px;
  font-weight:bold;
}

.logo span{
  color:#ffb000;
}

header a{
  color:white;
  text-decoration:none;
  padding:10px 14px;
  border-radius:6px;
}

header a:hover{
  background:#263242;
}


/* ================= CONTAINER ================= */

.container{
  max-width:1150px;
  margin:30px auto;
  padding:0 20px;
}

h1{
  margin-bottom:25px;
  font-size:30px;
}


/* ================= LAYOUT ================= */

.cart-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 320px;
  gap:22px;
}


/* ================= CART BOX ================= */

.cart-box{
  background:white;
  padding:25px;
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.cart-title{
  font-size:24px;
  font-weight:bold;
  padding-bottom:15px;
  border-bottom:1px solid #ddd;
}


/* ================= CART ITEM ================= */

.cart-item{

  display:flex;

  gap:22px;

  padding:22px 0;

  border-bottom:1px solid #ddd;

  align-items:flex-start;

  cursor:pointer;

  transition:.2s;

}

.cart-item:hover{
  background:#fafafa;
}


/* ================= IMAGE ================= */

.cart-image{

  width:150px;
  height:150px;

  flex-shrink:0;

  background:#f7f7f7;

  border-radius:8px;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

  border:1px solid #eee;

}

.cart-image img{

  width:100%;
  height:100%;

  object-fit:contain;

  display:block;

}

.cart-image .fallback-icon{
  font-size:55px;
}


/* ================= PRODUCT INFO ================= */

.item-info{
  flex:1;
  min-width:0;
}

.item-info h3{

  font-size:20px;

  line-height:1.4;

  margin-bottom:8px;

  color:#172033;

}

.item-info h3:hover{
  color:#2162a1;
}

.in-stock{

  color:#007600;

  font-size:14px;

  margin-bottom:12px;

}

.price{

  font-size:22px;

  font-weight:bold;

  color:#111;

  margin-bottom:14px;

}


/* ================= QUANTITY ================= */

.quantity{

  display:flex;

  align-items:center;

  gap:10px;

  margin-bottom:10px;

}

.quantity-label{
  font-size:14px;
  font-weight:bold;
}

.quantity button{

  width:34px;
  height:34px;

  border:1px solid #aaa;

  background:white;

  border-radius:5px;

  cursor:pointer;

  font-size:20px;

}

.quantity button:hover{

  background:#f3f3f3;

}

.quantity span{

  min-width:30px;

  text-align:center;

  font-weight:bold;

}


/* ================= REMOVE ================= */

.remove{

  border:none;

  background:none;

  color:#c40000;

  cursor:pointer;

  font-size:14px;

  padding:4px 0;

}

.remove:hover{
  text-decoration:underline;
}


/* ================= SUMMARY ================= */

.summary{

  background:white;

  padding:25px;

  border-radius:8px;

  height:max-content;

  position:sticky;

  top:20px;

  box-shadow:0 2px 6px rgba(0,0,0,.08);

}

.summary h2{

  margin-bottom:20px;

  font-size:22px;

}

.summary-row{

  display:flex;

  justify-content:space-between;

  margin:15px 0;

  color:#444;

}

.total{

  font-size:24px;

  font-weight:bold;

  color:#111;

  border-top:1px solid #ddd;

  padding-top:18px;

  margin-top:20px;

}


/* ================= CHECKOUT ================= */

.checkout{

  width:100%;

  padding:15px;

  border:none;

  background:#ffb000;

  border-radius:8px;

  font-weight:bold;

  font-size:16px;

  cursor:pointer;

  margin-top:20px;

}

.checkout:hover{

  background:#e6a000;

}


/* ================= EMPTY ================= */

.empty{

  text-align:center;

  padding:70px 10px;

  color:#667085;

}

.empty h2{

  margin-bottom:10px;

}

.empty p{

  margin-bottom:20px;

}

.shop{

  display:inline-block;

  background:#2563eb;

  color:white;

  padding:12px 20px;

  text-decoration:none;

  border-radius:7px;

}

.shop:hover{
  background:#1d4ed8;
}


/* ================= MOBILE ================= */

@media(max-width:800px){

  .cart-layout{
    grid-template-columns:1fr;
  }

  .summary{
    position:static;
  }

}

@media(max-width:600px){

  header{

    flex-direction:column;

    align-items:flex-start;

  }

  .container{

    padding:0 12px;

    margin-top:20px;

  }

  h1{
    font-size:25px;
  }

  .cart-box{
    padding:16px;
  }

  .cart-item{

    gap:14px;

  }

  .cart-image{

    width:100px;
    height:100px;

  }

  .item-info h3{

    font-size:16px;

  }

  .price{

    font-size:19px;

  }

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

  <div class="logo">
    ⚡ Nova <span>Power Tools</span>
  </div>

  <a href="index.html">
    ← Continue Shopping
  </a>

</header>


<!-- ================= MAIN ================= -->

<div class="container">

  <h1>
    🛒 Shopping Cart
  </h1>


  <div class="cart-layout">


    <!-- ================= CART ================= -->

    <div class="cart-box">

      <div class="cart-title">
        Your Cart
      </div>

      <div id="cartItems"></div>

    </div>


    <!-- ================= SUMMARY ================= -->

    <div class="summary">

      <h2>
        Order Summary
      </h2>


      <div class="summary-row">

        <span>
          Items
        </span>

        <span id="itemCount">
          0
        </span>

      </div>


      <div class="summary-row">

        <span>
          Subtotal
        </span>

        <span>
          ₹<span id="subtotal">0</span>
        </span>

      </div>


      <div class="summary-row">

        <span>
          Delivery
        </span>

        <span>
          FREE
        </span>

      </div>


      <div class="summary-row total">

        <span>
          Total
        </span>

        <span>
          ₹<span id="total">0</span>
        </span>

      </div>


      <button
        class="checkout"
        onclick="checkout()"
      >
        Proceed to Checkout
      </button>

    </div>


  </div>

</div>


<script>


/* =====================================================
   LOAD CART
===================================================== */

let cart =
  JSON.parse(
    localStorage.getItem("novaCart")
  ) || [];


/* =====================================================
   SAVE CART
===================================================== */

function saveCart(){

  localStorage.setItem(
    "novaCart",
    JSON.stringify(cart)
  );

}


/* =====================================================
   OPEN PRODUCT DETAILS
===================================================== */

function openProduct(index){

  const item =
    cart[index];


  if(!item || !item.name){

    return;

  }


  window.location.href =
    "product-details.html?product=" +
    encodeURIComponent(item.name);

}


/* =====================================================
   DISPLAY CART
===================================================== */

function displayCart(){

  const box =
    document.getElementById(
      "cartItems"
    );


  /* EMPTY CART */

  if(cart.length === 0){

    box.innerHTML = `

      <div class="empty">

        <h2>
          Your cart is empty 🛒
        </h2>

        <p>
          Add some products to your cart.
        </p>

        <a
          class="shop"
          href="index.html"
        >
          Start Shopping
        </a>

      </div>

    `;


    updateSummary();

    return;

  }


  box.innerHTML = "";


  /* CART PRODUCTS */

  cart.forEach(
    function(item,index){


      const imageHTML =
        item.image

          ?

        `

        <img
          src="${item.image}"
          alt="${item.name}"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
        >

        <span
          class="fallback-icon"
          style="display:none;"
        >
          ${item.icon || "🛠️"}
        </span>

        `

          :

        `

        <span class="fallback-icon">
          ${item.icon || "🛠️"}
        </span>

        `;


      box.innerHTML += `

        <div
          class="cart-item"
          onclick="openProduct(${index})"
        >


          <!-- PRODUCT IMAGE -->

          <div class="cart-image">

            ${imageHTML}

          </div>


          <!-- PRODUCT INFORMATION -->

          <div class="item-info">


            <h3>
              ${item.name}
            </h3>


            <div class="in-stock">
              In Stock
            </div>


            <div class="price">
              ₹${Number(item.price || 0).toLocaleString("en-IN")}
            </div>


            <!-- QUANTITY -->

            <div
              class="quantity"
              onclick="event.stopPropagation()"
            >

              <span class="quantity-label">
                Quantity:
              </span>


              <button
                onclick="event.stopPropagation(); changeQuantity(${index},-1)"
              >
                −
              </button>


              <span>
                ${item.quantity}
              </span>


              <button
                onclick="event.stopPropagation(); changeQuantity(${index},1)"
              >
                +
              </button>

            </div>


            <!-- REMOVE -->

            <button
              class="remove"
              onclick="event.stopPropagation(); removeItem(${index})"
            >
              Remove
            </button>


          </div>


        </div>

      `;

    }
  );


  updateSummary();

}


/* =====================================================
   CHANGE QUANTITY
===================================================== */

function changeQuantity(
  index,
  change
){

  if(!cart[index]){
    return;
  }


  cart[index].quantity =
    Number(cart[index].quantity || 1)
    + change;


  if(
    cart[index].quantity <= 0
  ){

    cart.splice(
      index,
      1
    );

  }


  saveCart();

  displayCart();

}


/* =====================================================
   REMOVE PRODUCT
===================================================== */

function removeItem(index){

  if(!cart[index]){
    return;
  }


  cart.splice(
    index,
    1
  );


  saveCart();

  displayCart();

}


/* =====================================================
   UPDATE SUMMARY
===================================================== */

function updateSummary(){

  let count = 0;

  let total = 0;


  cart.forEach(
    function(item){

      const quantity =
        Number(item.quantity) || 0;

      const price =
        Number(item.price) || 0;


      count += quantity;

      total +=
        price * quantity;

    }
  );


  document
    .getElementById("itemCount")
    .innerText =
    count;


  document
    .getElementById("subtotal")
    .innerText =
    total.toLocaleString("en-IN");


  document
    .getElementById("total")
    .innerText =
    total.toLocaleString("en-IN");

}


/* =====================================================
   CHECKOUT
===================================================== */

function checkout(){

  if(cart.length === 0){

    alert(
      "Your cart is empty."
    );

    return;

  }


  window.location.href =
    "checkout.html";

}


/* =====================================================
   START
===================================================== */

displayCart();

</script>


</body>
</html>
