<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Password Generator - Nova Power Tools</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:white;
  padding:22px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

header a{
  color:white;
  text-decoration:none;
}

.container{
  max-width:700px;
  margin:50px auto;
  padding:0 20px;
}

.title{
  text-align:center;
  margin-bottom:30px;
}

.title h1{
  font-size:40px;
  margin-bottom:10px;
}

.title span{
  color:#2563eb;
}

.title p{
  color:#667085;
}

.box{
  background:white;
  padding:30px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.password{
  display:flex;
  gap:10px;
  margin-bottom:25px;
}

.password input{
  flex:1;
  padding:15px;
  border:1px solid #d0d5dd;
  border-radius:10px;
  font-size:17px;
}

.copy{
  background:#2563eb;
  color:white;
  border:none;
  padding:0 20px;
  border-radius:10px;
  cursor:pointer;
}

.option{
  margin:18px 0;
}

.option label{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}

input[type="range"]{
  width:100%;
}

.checkbox{
  display:flex;
  gap:10px;
  margin:12px 0;
}

.generate{
  width:100%;
  padding:14px;
  margin-top:15px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:9px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.home{
  width:100%;
  padding:12px;
  margin-top:12px;
  background:#e5e7eb;
  color:#172033;
  border:none;
  border-radius:9px;
  cursor:pointer;
}

footer{
  text-align:center;
  padding:30px;
  margin-top:50px;
  background:#111827;
  color:white;
}

@media(max-width:600px){
  header{
    flex-direction:column;
    gap:12px;
  }

  .title h1{
    font-size:32px;
  }

  .password{
    flex-direction:column;
  }

  .copy{
    padding:12px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">⚡ Nova Power Tools</div>
  <a href="index.html">← Back to Home</a>
</header>

<main class="container">

  <div class="title">
    <h1>🔐 <span>Password Generator</span></h1>
    <p>Create strong random passwords instantly.</p>
  </div>

  <div class="box">

    <div class="password">
      <input type="text" id="password" readonly>
      <button class="copy" onclick="copyPassword()">Copy</button>
    </div>

    <div class="option">

      <label>
        <span>Password Length</span>
        <strong id="lengthValue">16</strong>
      </label>

      <input
        type="range"
        id="length"
        min="6"
        max="50"
        value="16"
        oninput="updateLength()"
      >

    </div>

    <div class="checkbox">
      <input type="checkbox" id="uppercase" checked>
      <label for="uppercase">Uppercase Letters (A-Z)</label>
    </div>

    <div class="checkbox">
      <input type="checkbox" id="lowercase" checked>
      <label for="lowercase">Lowercase Letters (a-z)</label>
    </div>

    <div class="checkbox">
      <input type="checkbox" id="numbers" checked>
      <label for="numbers">Numbers (0-9)</label>
    </div>

    <div class="checkbox">
      <input type="checkbox" id="symbols" checked>
      <label for="symbols">Symbols (!@#$)</label>
    </div>

    <button class="generate" onclick="generatePassword()">
      Generate Password
    </button>

    <button class="home" onclick="goHome()">
      Home
    </button>

  </div>

</main>

<footer>
  <p>© 2026 Nova Power Tools</p>
  <p>Free • Fast • Simple</p>
</footer>

<script>

function updateLength(){

  const length =
    document.getElementById("length").value;

  document.getElementById("lengthValue")
    .textContent = length;
}


function generatePassword(){

  const length =
    Number(document.getElementById("length").value);

  const uppercase =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  const lowercase =
    "abcdefghijklmnopqrstuvwxyz";

  const numbers =
    "0123456789";

  const symbols =
    "!@#$%^&*()_+-=[]{}|;:,.<>?";

  let characters = "";

  if(document.getElementById("uppercase").checked){
    characters += uppercase;
  }

  if(document.getElementById("lowercase").checked){
    characters += lowercase;
  }

  if(document.getElementById("numbers").checked){
    characters += numbers;
  }

  if(document.getElementById("symbols").checked){
    characters += symbols;
  }

  if(characters === ""){
    alert("Please select at least one option.");
    return;
  }

  let password = "";

  const randomArray =
    new Uint32Array(length);

  crypto.getRandomValues(randomArray);

  for(let i = 0; i < length; i++){

    password +=
      characters[randomArray[i] % characters.length];

  }

  document.getElementById("password")
    .value = password;
}


function copyPassword(){

  const password =
    document.getElementById("password").value;

  if(password === ""){
    alert("Generate a password first.");
    return;
  }

  navigator.clipboard.writeText(password);

  alert("Password copied!");
}


function goHome(){

  window.location.href = "index.html";

}


generatePassword();

</script>

</body>
</html>
