<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  color:#172033;
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 10%,rgba(37,99,235,.20),transparent 30%),
    radial-gradient(circle at 90% 90%,rgba(255,176,0,.12),transparent 30%),
    linear-gradient(135deg,#dbeafe,#eef4ff,#d9e7ff);
}

/* HEADER */

header{
  background:linear-gradient(90deg,#111827,#1f2937);
  color:white;
  padding:14px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 3px 15px rgba(0,0,0,.18);
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.logo span{
  color:#ffb000;
}

header a{
  color:white;
  text-decoration:none;
  font-size:13px;
}

header a:hover{
  color:#ffb000;
}

/* MAIN */

.container{
  max-width:1200px;
  margin:35px auto;
  padding:0 18px;
}

/* PRODUCT CARD */

.product-box{
  background:linear-gradient(135deg,#ffffff,#eff6ff);
  border-radius:18px;
  padding:22px;
  display:grid;
  grid-template-columns:48% 52%;
  gap:30px;
  box-shadow:
    0 15px 40px rgba(15,23,42,.14),
    0 3px 10px rgba(37,99,235,.08);
  border:1px solid rgba(37,99,235,.15);
}

/* IMAGE */

.product-image{
  min-height:520px;
  background:
    radial-gradient(
      circle at 50% 35%,
      #ffffff 0%,
      #eaf2ff 42%,
      #cbdcf7 100%
    );
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border:1px solid #93b4e8;
  position:relative;
  box-shadow:
    inset 0 0 35px rgba(37,99,235,.10),
    0 4px 15px rgba(15,23,42,.08);
}

.product-image::after{
  content:"NOVA POWER TOOLS";
  position:absolute;
  bottom:15px;
  left:0;
  right:0;
  text-align:center;
  font-size:11px;
  font-weight:bold;
  letter-spacing:2px;
  color:#2563eb;
  opacity:.65;
}

.product-image img{
  width:92%;
  height:92%;
  max-height:500px;
  object-fit:contain;
  transition:.3s ease;
  position:relative;
  z-index:2;
  filter:drop-shadow(0 12px 12px rgba(15,23,42,.18));
}

.product-image img:hover{
  transform:scale(1.04);
}

.product-placeholder{
  font-size:90px;
  opacity:.65;
  position:relative;
  z-index:2;
}

/* DETAILS */

.product-info{
  padding:8px 4px;
}

.product-info h1{
  font-size:30px;
  line-height:1.25;
  margin-bottom:8px;
  color:#111827;
}

.brand{
  display:inline-block;
  color:#2563eb;
  font-weight:bold;
  font-size:14px;
  background:#eff6ff;
  padding:5px 10px;
  border-radius:20px;
  margin-bottom:10px;
}

.rating{
  color:#f59e0b;
  font-size:15px;
  margin-bottom:12px;
}

/* PRICE */

.price{
  font-size:30px;
  font-weight:800;
  color:#111827;
  margin:14px 0 3px;
}

.old-price{
  color:#777;
  text-decoration:line-through;
  font-size:16px;
  margin-bottom:4px;
}

.discount{
  display:inline-block;
  color:#15803d;
  background:#dcfce7;
  padding:4px 8px;
  border-radius:6px;
  font-size:13px;
  font-weight:bold;
  margin-bottom:12px;
}

.price-note{
  color:#667085;
  font-size:13px;
  margin-bottom:18px;
}

/* DELIVERY */

.delivery{
  background:linear-gradient(135deg,#f0f7ff,#f8fbff);
  border:1px solid #dbeafe;
  padding:15px 17px;
  border-radius:12px;
  line-height:1.9;
  margin-bottom:22px;
  color:#334155;
  font-size:13px;
}

/* TITLES */

.about-title,
.spec-title{
  font-size:18px;
  font-weight:700;
  color:#111827;
  margin-bottom:10px;
  padding-bottom:7px;
  border-bottom:2px solid #eef2f7;
}

/* DESCRIPTION */

.description{
  color:#667085;
  line-height:1.7;
  font-size:14px;
  margin-bottom:22px;
}

/* TABLE */

.spec-table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  overflow:hidden;
  border-radius:10px;
  border:1px solid #e2e8f0;
  margin-bottom:22px;
}

.spec-table td{
  border-bottom:1px solid #e5e7eb;
  padding:11px 12px;
  font-size:13px;
}

.spec-table tr:last-child td{
  border-bottom:none;
}

.spec-table td:first-child{
  font-weight:bold;
  background:#f8fafc;
  color:#334155;
  width:40%;
}

.spec-table td:last-child{
  background:#fff;
  color:#475569;
}

/* BUTTONS */

.buttons{
  display:flex;
  gap:12px;
}

.buttons button{
  flex:1;
  padding:14px;
  border:none;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
  font-size:15px;
  transition:.2s;
  box-shadow:0 3px 8px rgba(0,0,0,.08);
}

.buttons button:hover{
  transform:translateY(-2px);
}

.cart-btn{
  background:#ffd814;
  color:#111827;
}

.buy-btn{
  background:#ff9900;
  color:#111827;
}

.back-btn{
  background:#2563eb;
  color:white;
  margin-top:11px;
  width:100%;
  padding:13px;
  border:none;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

.back-btn:hover{
  background:#1d4ed8;
}

/* ERROR */

.error{
  background:white;
  padding:50px 30px;
  text-align:center;
  border-radius:15px;
  box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.error h2{
  margin-bottom:15px;
}

.error p{
  color:#667085;
  margin-bottom:20px;
}

.error button{
  padding:12px 22px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:7px;
  cursor:pointer;
}

/* MOBILE */

@media(max-width:800px){

  .container{
    margin:20px auto;
    padding:0 12px;
  }

  .product-box{
    grid-template-columns:1fr;
    gap:20px;
    padding:15px;
  }

  .product-image{
    min-height:350px;
  }

  .product-info h1{
    font-size:24px;
  }

  .price{
    font-size:27px;
  }

  .buttons{
    flex-direction:column;
  }
}

@media(max-width:480px){

  header{
    padding:12px 15px;
  }

  .logo{
    font-size:17px;
  }

  header a{
    font-size:11px;
  }

  .product-image{
    min-height:280px;
  }

  .product-box{
    border-radius:12px;
  }
}
</style>
</head>

/* =====================================================
   URL PRODUCT NAME
===================================================== */

const params = new URLSearchParams(window.location.search);

const requestedProduct = params.get("product");


/* =====================================================
   ALIASES
===================================================== */

const aliases = {

  "Mark Pro MK-4SA":"I Mark Pro MK-4SA",
  "I Marknhi MK-4SA":"I Mark Pro MK-4SA",

  "Auto Power AP1112":"Auto Power Pro AP1112",

  "Auto Power APP1170":"Auto Power Pro APP1170",

  "METRO 20MM Rotary Hammer":"METRO Rotary Hammer 20MM",

  "METRO Rotary Hammer":"METRO Rotary Hammer 20MM",

  "METRO M-3106 Gasoline Chain Saw":"METRO M-3106",

  "Electric Hammer":"Electric Hammer Machine",

  "Bosch Grinder":"Bosch Grinder Machine"

};

const productKey =
  aliases[requestedProduct] || requestedProduct;


/* =====================================================
   PRICE CALCULATION
   FINAL PRICE = PRICE SET ABOVE
   OLD PRICE IS ALWAYS HIGHER
===================================================== */

function getOldPrice(price){

  if(!price){
    return null;
  }

  return Math.ceil(price / 0.80);
}


/* =====================================================
   SHOW PRODUCT
===================================================== */

function showProduct(){

  const area =
    document.getElementById("productArea");

  if(!productKey || !products[productKey]){

    area.innerHTML = `
      <div class="error">

        <h2>Product Not Found</h2>

        <p>
          Ye product product-details system mein
          available nahi hai.
        </p>

        <button onclick="window.location.href='index.html'">
          ← Back to Shop
        </button>

      </div>
    `;

    return;
  }


  const p = products[productKey];


  /* IMAGE */

  let imageHTML = "";

  if(p.image){

    imageHTML = `
      <img
        src="${p.image}"
        alt="${p.name}"
        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='block';
        "
      >

      <div
        class="product-placeholder"
        style="display:none"
      >
        🛠️
      </div>
    `;

  }else{

    imageHTML = `
      <div class="product-placeholder">
        🛠️
      </div>
    `;

  }


  /* SPECIFICATIONS */

  let specifications = "";

  for(const key in p.specs){

    specifications += `
      <tr>
        <td>${key}</td>
        <td>${p.specs[key]}</td>
      </tr>
    `;

  }


  /* PRICE */

  let priceHTML = "";

  if(p.price){

    const oldPrice =
      getOldPrice(p.price);

    priceHTML = `
      <div class="price">
        ₹${p.price.toLocaleString("en-IN")}
      </div>

      <div class="old-price">
        ₹${oldPrice.toLocaleString("en-IN")}
      </div>

      <div class="discount">
        20% OFF
      </div>
    `;

  }else{

    priceHTML = `
      <div class="price">
        Price to be updated
      </div>

      <div class="price-note">
        💰 Final price will be added later.
      </div>
    `;

  }


  /* PAGE */

  area.innerHTML = `

    <div class="product-box">

      <div class="product-image">
        ${imageHTML}
      </div>


      <div class="product-info">

        <h1>
          ${p.name}
        </h1>

        <div class="brand">
          ${p.brand}
        </div>

        <div class="rating">
          ⭐⭐⭐⭐⭐
        </div>

        ${priceHTML}


        <div class="delivery">

          🚚 <b>Delivery:</b>
          Usually delivered within 1 day

          <br>

          📍 Delivery available in
          Prayagraj and Banaras

          <br>

          🔄 Replacement available for
          eligible products

        </div>


        <h2 class="about-title">
          About this product
        </h2>

        <p class="description">
          ${p.description}
        </p>


        <h2 class="spec-title">
          Specifications
        </h2>

        <table class="spec-table">
          ${specifications}
        </table>


        <div class="buttons">

          <button
            class="cart-btn"
            onclick="addToCart()"
          >
            🛒 Add to Cart
          </button>

          <button
            class="buy-btn"
            onclick="buyNow()"
          >
            ⚡ Buy Now
          </button>

        </div>


        <button
          class="back-btn"
          onclick="window.location.href='index.html'"
        >
          ← Continue Shopping
        </button>

      </div>

    </div>

  `;

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(){

  const p = products[productKey];

  if(!p){
    return;
  }

  let cart =
    JSON.parse(
      localStorage.getItem("novaCart")
    ) || [];


  let existing =
    cart.find(function(item){

      return item.name === p.name;

    });


  if(existing){

    existing.quantity += 1;

  }else{

    cart.push({

      name:p.name,

      price:p.price || 0,

      icon:"🛠️",

      quantity:1

    });

  }


  localStorage.setItem(
    "novaCart",
    JSON.stringify(cart)
  );


  alert(
    p.name +
    " cart mein add ho gaya! 🛒"
  );

}


/* =====================================================
   BUY NOW
===================================================== */

function buyNow(){

  const p = products[productKey];

  if(!p){
    return;
  }

  window.location.href =
    "checkout.html?product=" +
    encodeURIComponent(p.name);

}


/* =====================================================
   START
===================================================== */

showProduct();

</script>
