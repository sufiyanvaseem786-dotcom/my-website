<html lang="en">
<head>

<meta charset="UTF-8">

<title>Product Details | Nova Power Tools</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:
    radial-gradient(circle at 10% 10%, rgba(37,99,235,.18), transparent 30%),
    radial-gradient(circle at 90% 90%, rgba(255,176,0,.10), transparent 30%),
    linear-gradient(135deg,#dbeafe 0%,#eef4ff 45%,#d9e7ff 100%);
  color:#172033;
  min-height:100vh;
}

/* HEADER */

header{
  background:linear-gradient(90deg,#111827,#1f2937);
  color:white;
  padding:14px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.logo span{
  color:#ffb000;
}

header a{
  color:#fff;
  text-decoration:none;
  font-size:13px;
  opacity:.9;
}

header a:hover{
  color:#ffb000;
}

/* MAIN */

.container{
  max-width:1200px;
  margin:35px auto;
  padding:0 18px;
}

/* PRODUCT CARD */
  
.product-box{
  background:linear-gradient(
    135deg,
    rgba(255,255,255,.98),
    rgba(239,246,255,.98)
  );

  border-radius:18px;
  padding:22px;

  display:grid;
  grid-template-columns:48% 52%;
  gap:30px;

  box-shadow:
    0 15px 40px rgba(15,23,42,.14),
    0 3px 10px rgba(37,99,235,.08);

  border:1px solid rgba(37,99,235,.15);
}

/* PRODUCT IMAGE AREA */

.product-image{
  min-height:520px;

  background:
    radial-gradient(
      circle at 50% 35%,
      #ffffff 0%,
      #eaf2ff 42%,
      #cbdcf7 100%
    );

  border-radius:14px;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  border:1px solid #93b4e8;

  position:relative;

  box-shadow:
    inset 0 0 35px rgba(37,99,235,.10),
    0 4px 15px rgba(15,23,42,.08);
}


/* NOVA POWER TOOLS LABEL */

.product-image::after{
  content:"NOVA POWER TOOLS";

  position:absolute;
  bottom:15px;
  left:0;
  right:0;

  text-align:center;

  font-size:11px;
  font-weight:bold;
  letter-spacing:2px;

  color:#2563eb;
  opacity:.65;

  z-index:3;
}


/* PRODUCT IMAGE */

.product-image img{
  width:92%;
  height:92%;

  max-height:500px;

  object-fit:contain;

  transition:.3s ease;

  position:relative;
  z-index:2;

  filter:drop-shadow(0 12px 12px rgba(15,23,42,.18));
}


/* IMAGE HOVER */

.product-image img:hover{
  transform:scale(1.04);
}


/* PRODUCT PLACEHOLDER */

.product-placeholder{
  font-size:90px;
  opacity:.65;
  position:relative;
  z-index:2;
}

/* DETAILS */

.product-info{
  padding:8px 4px;
}

.product-info h1{
  font-size:30px;
  line-height:1.25;
  margin-bottom:8px;
  color:#111827;
}

.brand{
  display:inline-block;

  color:#2563eb;

  font-weight:bold;
  font-size:14px;

  background:#eff6ff;

  padding:5px 10px;

  border-radius:20px;

  margin-bottom:10px;
}

.rating{
  color:#f59e0b;
  font-size:15px;
  margin-bottom:12px;
}

/* PRICE */

.price{
  font-size:30px;
  font-weight:800;

  color:#111827;

  margin:14px 0 5px;
}

.price-note{
  color:#667085;
  font-size:13px;
  margin-bottom:18px;
}

/* DELIVERY */

.delivery{
  background:linear-gradient(135deg,#f0f7ff,#f8fbff);

  border:1px solid #dbeafe;

  padding:15px 17px;

  border-radius:12px;

  line-height:1.9;

  margin-bottom:22px;

  color:#334155;

  font-size:13px;

  box-shadow:0 3px 10px rgba(37,99,235,.05);
}

/* TITLES */

.about-title,
.spec-title{
  font-size:18px;
  font-weight:700;

  color:#111827;

  margin-bottom:10px;

  padding-bottom:7px;

  border-bottom:2px solid #eef2f7;
}

/* DESCRIPTION */

.description{
  color:#667085;

  line-height:1.7;

  font-size:14px;

  margin-bottom:22px;
}

/* SPECIFICATIONS */

.spec-table{
  width:100%;

  border-collapse:separate;
  border-spacing:0;

  overflow:hidden;

  border-radius:10px;

  border:1px solid #e2e8f0;

  margin-bottom:22px;
}

.spec-table td{
  border-bottom:1px solid #e5e7eb;

  padding:11px 12px;

  font-size:13px;
}

.spec-table tr:last-child td{
  border-bottom:none;
}

.spec-table td:first-child{
  font-weight:bold;

  background:#f8fafc;

  color:#334155;

  width:40%;
}

.spec-table td:last-child{
  background:#fff;

  color:#475569;
}

/* BUTTONS */

.buttons{
  display:flex;
  gap:12px;
}

.buttons button{
  flex:1;

  padding:14px;

  border:none;

  border-radius:9px;

  font-weight:bold;

  cursor:pointer;

  font-size:15px;

  transition:.2s ease;

  box-shadow:0 3px 8px rgba(0,0,0,.08);
}

.buttons button:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 14px rgba(0,0,0,.12);
}

/* CART */

.cart-btn{
  background:#ffd814;
  color:#111827;
}

.cart-btn:hover{
  background:#f7ca00;
}

/* BUY */

.buy-btn{
  background:#ff9900;
  color:#111827;
}

.buy-btn:hover{
  background:#fb8500;
}

/* BACK BUTTON */

.back-btn{
  background:#2563eb;

  color:white;

  margin-top:11px;

  width:100%;

  padding:13px;

  border:none;

  border-radius:9px;

  font-weight:bold;

  cursor:pointer;

  transition:.2s ease;
}

.back-btn:hover{
  background:#1d4ed8;
  transform:translateY(-1px);
}

/* ERROR */

.error{
  background:white;

  padding:50px 30px;

  text-align:center;

  border-radius:15px;

  box-shadow:0 5px 25px rgba(0,0,0,.08);

  border:1px solid #e5e7eb;
}

.error h2{
  margin-bottom:15px;
}

.error p{
  color:#667085;
  margin-bottom:20px;
}

.error button{
  padding:12px 22px;

  background:#2563eb;

  color:white;

  border:none;

  border-radius:7px;

  cursor:pointer;
}

/* MOBILE */

@media(max-width:800px){

  .container{
    margin:20px auto;
    padding:0 12px;
  }

  .product-box{
    grid-template-columns:1fr;
    gap:20px;
    padding:15px;
  }

  .product-image{
    min-height:350px;
  }

  .product-info h1{
    font-size:24px;
  }

  .price{
    font-size:27px;
  }

  .buttons{
    flex-direction:column;
  }

}

@media(max-width:480px){

  header{
    padding:12px 15px;
  }

  .logo{
    font-size:17px;
  }

  header a{
    font-size:11px;
  }

  .product-image{
    min-height:280px;
  }

  .product-box{
    border-radius:12px;
  }

}

</style>

</head>

const productKey =

/* =====================================================
   DISPLAY PRODUCT
===================================================== */

function showProduct(){

  const area =
    document.getElementById("productArea");


  if(
    !productKey ||
    !products[productKey]
  ){

    area.innerHTML = `

      <div class="error">

        <h2>Product Not Found</h2>

        <p>
          Ye product abhi product-details
          system mein available nahi hai.
        </p>

        <br>

        <button onclick="window.location.href='index.html'">
          ← Back to Shop
        </button>

      </div>

    `;

    return;

  }


  const p =
    products[productKey];


  /* IMAGE */

  let imageHTML = "";


  if(p.image){

    imageHTML = `

      <img
        src="${p.image}"
        alt="${p.name}"
        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='block';
        "
      >

      <div
        class="product-placeholder"
        style="display:none"
      >
        🛠️
      </div>

    `;

  }else{

    imageHTML = `

      <div class="product-placeholder">
        🛠️
      </div>

    `;

  }


  /* SPECIFICATIONS */

  let specifications = "";


  for(const key in p.specs){

    specifications += `

      <tr>

        <td>${key}</td>

        <td>${p.specs[key]}</td>

      </tr>

    `;

  }


  /* PAGE */

  area.innerHTML = `

    <div class="product-box">


      <!-- PRODUCT IMAGE -->

      <div class="product-image">

        ${imageHTML}

      </div>


      <!-- PRODUCT INFORMATION -->

      <div class="product-info">

        <h1>
          ${p.name}
        </h1>


        <div class="brand">
          ${p.brand}
        </div>


        <div class="rating">
          ⭐⭐⭐⭐⭐
        </div>


       <div class="price">
  ₹${p.price.toLocaleString("en-IN")}
</div>

<div class="old-price">
  ₹${p.oldPrice.toLocaleString("en-IN")}
</div>

<div class="discount">
  ${p.discount}
</div>

<div class="price-note">
  💰 Special online price
</div>


        <div class="delivery">

          🚚 <b>Delivery:</b>
          Usually delivered within 1 day

          <br>

          📍 Delivery available in
          Prayagraj and Banaras

          <br>

          🔄 Replacement available for
          eligible products

        </div>


        <h2 class="about-title">
          About this product
        </h2>


        <p class="description">
          ${p.description}
        </p>


        <h2 class="spec-title">
          Specifications
        </h2>


        <table class="spec-table">

          ${specifications}

        </table>


        <div class="buttons">

          <button
            class="cart-btn"
            onclick="addToCart()"
          >
            🛒 Add to Cart
          </button>


          <button
            class="buy-btn"
            onclick="buyNow()"
          >
            ⚡ Buy Now
          </button>

        </div>


        <button
          class="back-btn"
          onclick="window.location.href='index.html'"
        >
          ← Continue Shopping
        </button>


      </div>

    </div>

  `;

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(){

  const p =
    products[productKey];


  if(!p){
    return;
  }


  let cart =
    JSON.parse(
      localStorage.getItem("novaCart")
    ) || [];


  let existing =
    cart.find(function(item){

      return item.name === p.name;

    });


  if(existing){

    existing.quantity += 1;

  }else{

    cart.push({

      name:p.name,

      price:0,

      icon:"🛠️",

      quantity:1

    });

  }


  localStorage.setItem(
    "novaCart",
    JSON.stringify(cart)
  );


  alert(
    p.name +
    " cart mein add ho gaya! 🛒"
  );

}


/* =====================================================
   BUY NOW
===================================================== */

function buyNow(){

  const p =
    products[productKey];


  if(!p){
    return;
  }


  window.location.href =
    "checkout.html?product=" +
    encodeURIComponent(p.name);

}
