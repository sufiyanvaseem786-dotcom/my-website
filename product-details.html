<style>

*{

body{

header{
  background:#131921;
  color:white;
  padding:12px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{

}

.logo span{
  color:#ffb000;
}

header a{
  color:white;
  text-decoration:none;
  font-size:13px;
}

.container{
  max-width:1000px;
  margin:25px auto;
  padding:0 15px;
}

.product-box{
  background:white;
  border-radius:8px;
  padding:15px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.product-image-box{
  border:1px solid #ddd;
  border-radius:6px;
  min-height:420px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fafafa;
  overflow:hidden;
}

.product-image-box img{
  width:100%;
  height:400px;
  object-fit:contain;
}

.product-image-box .emoji{
  font-size:150px;
}

.product-info h1{
  font-size:28px;
  margin-bottom:10px;
}

.rating{
  color:#f59e0b;
  margin-bottom:12px;
}

.line{
  border-top:1px solid #aaa;
  margin:10px 0;
}

.price{
  font-size:27px;
  font-weight:bold;
  display:inline-block;
  margin-right:10px;
}

.old-price{
  color:#667085;
  text-decoration:line-through;
  font-size:14px;
}

.discount{
  color:#15803d;
  font-weight:bold;
  font-size:17px;
  margin-left:5px;
}

.delivery{
  background:#f5f7fa;
  padding:15px;
  border-radius:6px;
  margin:15px 0;
  line-height:1.8;
  font-size:13px;
}

.delivery strong{
  color:#172033;
}

.about{
  margin-top:15px;
}

.about h2,
.specifications h2{
  font-size:18px;
  margin-bottom:10px;
}

.about p{
  color:#555;
  line-height:1.6;
  font-size:14px;
}

.specifications{
  margin-top:18px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

td{
  border:1px solid #ddd;
  padding:9px;
}

td:first-child{
  font-weight:bold;
  width:35%;
}

.buttons{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.buttons button{
  flex:1;
  padding:13px;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
}

.cart-btn{
  background:#ffd814;
}

.buy-btn{
  background:#ff9900;
}

.message{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#16a34a;
  color:white;
  padding:13px 18px;
  border-radius:7px;
  display:none;
}

@media(max-width:700px){

  .product-box{
    grid-template-columns:1fr;
  }

  .product-image-box{
    min-height:300px;
  }

  .product-image-box img{
    height:280px;
  }

  .product-info h1{
    font-size:22px;
  }

}

const params =
new URLSearchParams(
  window.location.search
);

const productName =
params.get("product");


const product =
products[productName];


if(!product){

  document.getElementById("productName").innerText =
  "Product Not Found";

}else{

  document.getElementById("productName").innerText =
  productName;

  document.getElementById("rating").innerText =
  product.rating;

  document.getElementById("price").innerText =
  "₹" + product.price.toLocaleString("en-IN");

  document.getElementById("oldPrice").innerText =
  "₹" + product.oldPrice.toLocaleString("en-IN");

  document.getElementById("discount").innerText =
  product.discount;

  document.getElementById("description").innerText =
  product.description;


  const imageBox =
  document.getElementById("imageBox");


  if(product.image){

    imageBox.innerHTML =
    '<img src="' +
    product.image +
    '" alt="' +
    productName +
    '">';

  }else{

    imageBox.innerHTML =
    '<div class="emoji">' +
    product.emoji +
    '</div>';

  }


  const table =
  document.getElementById("specTable");


  table.innerHTML = "";


  for(
    const key in product.specs
  ){

    table.innerHTML +=
    "<tr>" +
    "<td>" + key + "</td>" +
    "<td>" +
    product.specs[key] +
    "</td>" +
    "</tr>";

  }

}


function addToCart(){

  if(!product){

    return;

  }


  let cart =
  JSON.parse(
    localStorage.getItem("novaCart")
  ) || [];


  let existing =
  cart.find(function(item){

    return item.name === productName;

  });


  if(existing){

    existing.quantity += 1;

  }else{

    cart.push({

      name:productName,

      price:product.price,

      icon:product.emoji || "🛠️",

      quantity:1

    });

  }


  localStorage.setItem(
    "novaCart",
    JSON.stringify(cart)
  );


  const message =
  document.getElementById("message");


  message.innerText =
  productName +
  " added to cart! 🛒";


  message.style.display =
  "block";


  setTimeout(function(){

    message.style.display =
    "none";

  },2000);

}


function buyNow(){

  if(!product){

    return;

  }


  window.location.href =
  "checkout.html?product=" +
  encodeURIComponent(productName);

}
