/* HEADER */

header{
  background:#131921;

  justify-content:space-between;
}

}

}

.back{

}

/* PRODUCT AREA */

.product-container{
  max-width:1100px;
  margin:30px auto;
  background:white;
  border-radius:8px;
  padding:20px;
  display:grid;
  grid-template-columns:42% 58%;
  gap:25px;
}

/* IMAGE */

.image-box{
  border:1px solid #ddd;
  border-radius:8px;
  min-height:430px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f8f8f8;
  padding:20px;
}

.image-box img{
  max-width:100%;
  max-height:390px;
  object-fit:contain;
}

.image-placeholder{
  text-align:center;
  font-size:100px;
}

/* DETAILS */

.details h1{
  font-size:28px;
  margin-bottom:10px;
}

.brand{
  color:#667085;
  margin-bottom:10px;
}

.rating{
  color:#f5b000;
  margin:10px 0;
}

.price{
  font-size:28px;
  font-weight:bold;
  margin-top:12px;
}

.old-price{
  color:#777;
  text-decoration:line-through;
  font-size:15px;
  margin-top:5px;
}

.discount{
  color:#15803d;
  font-weight:bold;
  margin-top:5px;
}

.info-box{
  background:#f5f7fa;
  padding:15px;
  border-radius:7px;
  margin:20px 0;
  line-height:1.8;
}

.about{
  margin-top:20px;
}

.about h2,
.specifications h2{
  font-size:19px;
  margin-bottom:10px;
}

.about p{
  color:#555;
  line-height:1.6;
}

/* TABLE */

.specifications{
  margin-top:22px;
}

table{
  width:100%;
  border-collapse:collapse;
}

td{
  border:1px solid #ddd;
  padding:10px;
  font-size:14px;
}

td:first-child{
  font-weight:bold;
  width:35%;
  background:#f8f8f8;
}

/* BUTTONS */

.buttons{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.buttons button{
  flex:1;
  border:none;
  padding:14px;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
  font-size:15px;
}

.add-cart{
  background:#ffd814;
}

.buy-now{
  background:#ff9900;
}

.buttons button:hover{
  opacity:.9;
}

/* DELIVERY */

.delivery{
  margin-top:18px;
  background:#f8fafc;
  padding:14px;
  border-radius:7px;
  line-height:1.8;
  font-size:14px;
}

/* MESSAGE */

#message{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#16a34a;
  color:white;
  padding:14px 20px;
  border-radius:8px;
  display:none;
  z-index:9999;
}

/* MOBILE */

@media(max-width:750px){

  .product-container{
    grid-template-columns:1fr;
    margin:15px;
  }

  .image-box{

  }

  .details h1{

/* =========================================
   GET PRODUCT FROM URL
========================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const productName =
  params.get("product");


const product =
  products[productName];


/* =========================================
   DISPLAY PRODUCT
========================================= */

if(product){

  document.getElementById("productName").innerText =
    productName;

  document.getElementById("brand").innerText =
    "Brand: " + product.brand +
    " | Category: " + product.category;


  document.getElementById("description").innerText =
    product.description;


  /* IMAGE */

  const imageBox =
    document.getElementById("imageBox");


  if(product.image){

    imageBox.innerHTML =
      '<img src="' +
      product.image +
      '" alt="' +
      productName +
      '">';

  }else{

    imageBox.innerHTML =
      '<div class="image-placeholder">🛠️</div>';

  }


  /* SPECIFICATIONS */

  const table =
    document.getElementById("specTable");


  for(const key in product.specs){

    const row =
      document.createElement("tr");


    row.innerHTML =
      "<td>" +
      key +
      "</td>" +
      "<td>" +
      product.specs[key] +
      "</td>";


    table.appendChild(row);

  }

}else{

  document.getElementById("productName").innerText =
    "Product Not Found";

  document.getElementById("description").innerText =
    "This product could not be found.";

}


/* =========================================
   ADD TO CART
========================================= */

function addToCart(){

  if(!product){
    return;
  }


  let cart =
    JSON.parse(
      localStorage.getItem("novaCart")
    ) || [];


  let existing =
    cart.find(function(item){

      return item.name === productName;

    });


  if(existing){

    existing.quantity += 1;

  }else{

    cart.push({

      name:productName,

      price:0,

      icon:"🛠️",

      quantity:1

    });

  }


  localStorage.setItem(
    "novaCart",
    JSON.stringify(cart)
  );


  const message =
    document.getElementById("message");


  message.innerText =
    productName +
    " added to cart! 🛒";


  message.style.display =
    "block";


  setTimeout(function(){

    message.style.display =
      "none";

  },2000);

}


/* =========================================
   BUY NOW
========================================= */

function buyNow(){

  if(!product){
    return;
  }


  window.location.href =
    "checkout.html?product=" +
    encodeURIComponent(productName);

}
