<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#eaeded;
  color:#172033;
}

/* HEADER */

header{
  background:#131921;
  color:white;
  padding:12px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logo span{
  color:#ffb000;
}

header a{
  color:white;
  text-decoration:none;
  font-size:13px;
}

/* MAIN */

.container{
  max-width:1100px;
  margin:30px auto;
  padding:0 15px;
}

.product-box{
  background:white;
  border-radius:10px;
  padding:18px;
  display:grid;
  grid-template-columns:45% 55%;
  gap:25px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

/* IMAGE */

.product-image{
  min-height:430px;
  background:#f5f7fb;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.product-image img{
  width:100%;
  height:100%;
  max-height:430px;
  object-fit:contain;
}

.product-placeholder{
  font-size:100px;
}

/* DETAILS */

.product-info h1{
  font-size:28px;
  margin-bottom:10px;
}

.brand{
  color:#2563eb;
  font-weight:bold;
  margin-bottom:10px;
}

.rating{
  color:#f59e0b;
  margin-bottom:12px;
}

.price{
  font-size:30px;
  font-weight:bold;
  margin:12px 0;
}

.price-note{
  color:#667085;
  font-size:14px;
  margin-bottom:18px;
}

.delivery{
  background:#f5f7fb;
  padding:15px;
  border-radius:8px;
  line-height:1.8;
  margin-bottom:20px;
}

.about-title{
  font-size:20px;
  margin-bottom:10px;
}

.description{
  color:#667085;
  line-height:1.6;
  margin-bottom:20px;
}

/* SPECIFICATIONS */

.spec-title{
  font-size:20px;
  margin-bottom:10px;
}

.spec-table{
  width:100%;
  border-collapse:collapse;
  margin-bottom:20px;
}

.spec-table td{
  border:1px solid #ddd;
  padding:10px;
  font-size:14px;
}

.spec-table td:first-child{
  font-weight:bold;
  background:#f8f9fa;
  width:40%;
}

/* BUTTONS */

.buttons{
  display:flex;
  gap:10px;
}

.buttons button{
  flex:1;
  padding:14px;
  border:none;
  border-radius:7px;
  font-weight:bold;
  cursor:pointer;
  font-size:15px;
}

.cart-btn{
  background:#ffd814;
}

.buy-btn{
  background:#ff9900;
}

.back-btn{
  background:#2563eb;
  color:white;
  margin-top:10px;
  width:100%;
}

/* ERROR */

.error{
  background:white;
  padding:40px;
  text-align:center;
  border-radius:10px;
}

.error h2{
  margin-bottom:15px;
}

.error button{
  padding:12px 20px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

/* MOBILE */

@media(max-width:700px){

  .product-box{
    grid-template-columns:1fr;
  }

  .product-image{
    min-height:300px;
  }

  .product-info h1{
    font-size:23px;
  }

  .price{
    font-size:26px;
  }

  .buttons{
    flex-direction:column;
  }

}

</style>

</head>

  if(!productName || !products[productName]){

    area.innerHTML = `

      <div class="error">

        <h2>Product Not Found</h2>

        <p>
          Ye product abhi product-details system
          mein add nahi hai.
        </p>

        <br>

        <button onclick="window.location.href='index.html'">
          ← Back to Shop
        </button>

      </div>

    `;

    return;

  }


  const p =
    products[productName];


  let imageHTML = "";

  if(p.image){

    imageHTML = `
      <img
        src="${p.image}"
        alt="${p.name}"
        onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
      >

      <div
        class="product-placeholder"
        style="display:none"
      >
        🛠️
      </div>
    `;

  }else{

    imageHTML = `
      <div class="product-placeholder">
        🛠️
      </div>
    `;

  }


  let specifications = "";

  for(const key in p.specs){

    specifications += `

      <tr>

        <td>${key}</td>

        <td>${p.specs[key]}</td>

      </tr>

    `;

  }


  area.innerHTML = `

    <div class="product-box">


      <div class="product-image">

        ${imageHTML}

      </div>


      <div class="product-info">

        <h1>
          ${p.name}
        </h1>


        <div class="brand">
          ${p.brand}
        </div>


        <div class="rating">
          ⭐⭐⭐⭐⭐
        </div>


        <div class="price">
          Price to be updated
        </div>


        <div class="price-note">
          💰 Final price will be added later.
        </div>


        <div class="delivery">

          🚚 <b>Delivery:</b>
          Usually delivered within 1 day
          <br>

          📍 Delivery available in Prayagraj and Banaras
          <br>

          🔄 Replacement available for eligible products

        </div>


        <h2 class="about-title">
          About this product
        </h2>


        <p class="description">
          ${p.description}
        </p>


        <h2 class="spec-title">
          Specifications
        </h2>


        <table class="spec-table">

          ${specifications}

        </table>


        <div class="buttons">

          <button
            class="cart-btn"
            onclick="addToCart()"
          >
            🛒 Add to Cart
          </button>


          <button
            class="buy-btn"
            onclick="buyNow()"
          >
            ⚡ Buy Now
          </button>

        </div>


        <button
          class="back-btn"
          onclick="window.location.href='index.html'"
        >
          ← Continue Shopping
        </button>


      </div>

    </div>

  `;

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(){

  const p =
    products[productName];

  if(!p){
    return;
  }


  let cart =
    JSON.parse(
      localStorage.getItem("novaCart")
    ) || [];


  let existing =
    cart.find(function(item){

      return item.name === p.name;

    });


  if(existing){

    existing.quantity += 1;

  }else{

    cart.push({

      name:p.name,

      price:0,

      icon:"🛠️",

      quantity:1

    });

  }


  localStorage.setItem(
    "novaCart",
    JSON.stringify(cart)
  );


  alert(
    p.name +
    " cart mein add ho gaya! 🛒\n\nPrice baad mein update kar dena."
  );

}


/* =====================================================
   BUY NOW
===================================================== */

function buyNow(){

  const p =
    products[productName];

  if(!p){
    return;
  }


  window.location.href =
    "checkout.html?product=" +
    encodeURIComponent(p.name);

}
