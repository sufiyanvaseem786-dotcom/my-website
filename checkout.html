<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout - Nova Power Tools</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#172033;
}

header{
  background:#111827;
  color:white;
  padding:18px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

header a{
  color:white;
  text-decoration:none;
}

.container{
  max-width:1100px;
  margin:40px auto;
  padding:0 20px;
}

h1{
  margin-bottom:25px;
}

.checkout{
  display:grid;
  grid-template-columns:1fr 380px;
  gap:25px;
}

.box{
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.box h2{
  margin-bottom:20px;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:6px;
  font-weight:bold;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:7px;
  font-size:16px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.product{
  display:flex;
  gap:15px;
  padding-bottom:20px;
  border-bottom:1px solid #ddd;
}

.product-image{
  width:100px;
  height:100px;
  background:#f3f4f6;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
}

.product h3{
  margin-bottom:10px;
}

.price{
  font-size:20px;
  font-weight:bold;
}

.payment{
  margin-top:25px;
}

.payment label{
  font-weight:normal;
  margin:10px 0;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  margin:15px 0;
}

.total{
  border-top:1px solid #ddd;
  padding-top:18px;
  font-size:22px;
  font-weight:bold;
}

.place-order{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:none;
  border-radius:8px;
  background:#ffb000;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.place-order:hover{
  background:#f59e0b;
}

@media(max-width:700px){
  .checkout{
    grid-template-columns:1fr;
  }

  header{
    flex-direction:column;
    gap:10px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    ⚡ Nova Power Tools
  </div>

  <a href="index.html">
    ← Continue Shopping
  </a>

</header>

<div class="container">

  <h1>🛒 Checkout</h1>

  <div class="checkout">

    <!-- CUSTOMER DETAILS -->

    <div class="box">

      <h2>Delivery Details</h2>

      <label>Full Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
      >

      <label>Mobile Number</label>
      <input
        type="tel"
        id="phone"
        placeholder="Enter mobile number"
      >

      <label>Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter email address"
      >

      <label>Address</label>
      <textarea
        id="address"
        placeholder="House/Shop No., Street, Area"
      ></textarea>

      <label>City</label>
      <input
        type="text"
        id="city"
        placeholder="Enter city"
      >

      <label>PIN Code</label>
      <input
        type="text"
        id="pincode"
        placeholder="Enter PIN code"
      >

      <div class="payment">

        <h2>Payment Method</h2>

        <label>
          <input
            type="radio"
            name="payment"
            value="COD"
            checked
          >
          Cash on Delivery
        </label>

        <label>
          <input
            type="radio"
            name="payment"
            value="UPI"
          >
          UPI Payment
        </label>

      </div>

    </div>


    <!-- ORDER SUMMARY -->

    <div class="box">

      <h2>Order Summary</h2>

      <div class="product">

        <div class="product-image">
          🔧
        </div>

        <div>

          <h3 id="productName">
            Product
          </h3>

          <div class="price">
            ₹1,899
          </div>

          <p>
            Quantity: 1
          </p>

        </div>

      </div>

      <div class="summary-row">
        <span>Price</span>
        <span>₹1,899</span>
      </div>

      <div class="summary-row">
        <span>Delivery</span>
        <span>FREE</span>
      </div>

      <div class="summary-row total">
        <span>Total</span>
        <span>₹1,899</span>
      </div>

      <button
        class="place-order"
        onclick="placeOrder()"
      >
        Place Order
      </button>

    </div>

  </div>

</div>


<script>

const params =
  new URLSearchParams(window.location.search);

const product =
  params.get("product");

if(product){

  document.getElementById("productName").innerText =
    product;

}


function placeOrder(){

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const address =
    document.getElementById("address").value.trim();

  const city =
    document.getElementById("city").value.trim();

  const pincode =
    document.getElementById("pincode").value.trim();


  if(
    !name ||
    !phone ||
    !email ||
    !address ||
    !city ||
    !pincode
  ){

    alert("Please fill all delivery details.");

    return;

  }


  alert(
    "Order details received!\n\n" +
    "Product: " + (product || "Product") +
    "\nName: " + name +
    "\nMobile: " + phone
  );

}

</script>

</body>
</html>
