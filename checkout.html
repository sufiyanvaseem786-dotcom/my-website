<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout - Nova Power Tools</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#eaeded;
  color:#172033;
}

header{
  background:#131921;
  color:white;
  padding:15px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:23px;
  font-weight:bold;
}

.logo span{
  color:#ffb000;
}

header a{
  color:white;
  text-decoration:none;
}

.container{
  max-width:1000px;
  margin:30px auto;
  padding:0 20px;
}

.checkout-grid{
  display:grid;
  grid-template-columns:1fr 350px;
  gap:20px;
}

.box{
  background:white;
  padding:25px;
  border-radius:8px;
  margin-bottom:20px;
}

.box h2{
  margin-bottom:20px;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:6px;
  font-weight:bold;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #bbb;
  border-radius:6px;
  font-size:15px;
}

textarea{
  height:90px;
  resize:vertical;
}

.payment{
  display:flex;
  gap:10px;
}

.payment label{
  flex:1;
  border:1px solid #ccc;
  padding:15px;
  border-radius:7px;
  cursor:pointer;
}

.payment input{
  width:auto;
}

.order-item{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #ddd;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:23px;
  font-weight:bold;
  margin-top:20px;
}

.place-order{
  width:100%;
  margin-top:25px;
  padding:14px;
  border:none;
  border-radius:7px;
  background:#ffb000;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.success{
  display:none;
  background:#dcfce7;
  color:#166534;
  padding:20px;
  border-radius:8px;
  margin-top:20px;
  text-align:center;
}

#pageLoading{
  text-align:center;
  padding:60px 20px;
  font-size:20px;
  color:#667085;
}

#checkoutContent{
  display:none;
}

@media(max-width:700px){

  .checkout-grid{
    grid-template-columns:1fr;
  }

  header{
    flex-direction:column;
    gap:12px;
  }

  .payment{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div id="pageLoading">
  🔐 Checking your login...
</div>

<div id="checkoutContent">

<header>

  <div class="logo">
    ⚡ Nova <span>Power Tools</span>
  </div>

  <a href="cart.html">
    ← Back to Cart
  </a>

</header>

<div class="container">

  <h1 style="margin-bottom:25px;">
    Checkout
  </h1>

  <div class="checkout-grid">

    <div>

      <div class="box">

        <h2>📍 Delivery Information</h2>

        <label>Full Name</label>

        <input
          type="text"
          id="name"
          placeholder="Enter your name"
          required
        >

        <label>Mobile Number</label>

        <input
          type="tel"
          id="phone"
          placeholder="Enter mobile number"
          maxlength="10"
          required
        >

        <label>Email</label>

        <input
          type="email"
          id="email"
          placeholder="Enter email address"
        >

        <label>Full Address</label>

        <textarea
          id="address"
          placeholder="House No., Street, Area"
          required
        ></textarea>

        <label>City</label>

        <input
          type="text"
          id="city"
          placeholder="Enter city"
          required
        >

        <label>PIN Code</label>

        <input
          type="number"
          id="pincode"
          placeholder="Enter PIN code"
          required
        >

      </div>

      <div class="box">

        <h2>💳 Payment Method</h2>

        <div class="payment">

          <label>
            <input
              type="radio"
              name="payment"
              value="COD"
              checked
            >
            💵 Cash on Delivery
          </label>

          <label>
            <input
              type="radio"
              name="payment"
              value="UPI"
            >
            📱 UPI Payment
          </label>

        </div>

      </div>

    </div>

    <div class="box">

      <h2>📦 Your Order</h2>

      <div id="orderItems"></div>

      <div class="total">

        <span>Total</span>

        <span>
          ₹<span id="total">0</span>
        </span>

      </div>

      <button
        class="place-order"
        onclick="placeOrder()"
      >
        🛍️ Place Order
      </button>

      <div
        class="success"
        id="success"
      >
        <h2>🎉 Order Placed!</h2>

        <p>
          Thank you for shopping with
          Nova Power Tools.
        </p>

        <p style="margin-top:10px;">
          We will contact you shortly.
        </p>
      </div>

    </div>

  </div>

</div>

</div>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyAGOZn1c-iWzH3g3OS_TTlh1uz1Ju5gmjw",

  authDomain:
    "nova-power-tools.firebaseapp.com",

  projectId:
    "nova-power-tools",

  storageBucket:
    "nova-power-tools.firebasestorage.app",

  messagingSenderId:
    "265235157417",

  appId:
    "1:265235157417:web:60d630ee374f21b05234b8",

  measurementId:
    "G-PF74PNJQ89"
};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);


/*
  LOGIN CHECK
*/

onAuthStateChanged(auth,function(user){

  if(!user){

    /*
      User login nahi hai.
      Login page par bhejo aur
      checkout par wapas aane ka
      address save karo.
    */

    window.location.href =
      "login.html?returnUrl=checkout.html";

    return;
  }


  /*
    User logged in hai.
    Checkout dikhao.
  */

  document.getElementById("pageLoading")
    .style.display = "none";

  document.getElementById("checkoutContent")
    .style.display = "block";


  /*
    Firebase account ka email
    checkout email mein automatically.
  */

  if(user.email){

    document.getElementById("email")
      .value = user.email;

  }

});


let cart = [];

const buyNowData =
  JSON.parse(
    localStorage.getItem("novaBuyNow")
  );

if(buyNowData && buyNowData.name){

  cart = [{
    name: buyNowData.name,
    price: 0,
    quantity: buyNowData.quantity || 1,
    icon: "🛠️"
  }];

}else{

  cart =
    JSON.parse(
      localStorage.getItem("novaCart")
    ) || [];

}

function showOrder(){

  let box =
    document.getElementById("orderItems");

  let total = 0;

  if(cart.length === 0){

    box.innerHTML =
      "<p>Your cart is empty.</p>";

    return;

  }


  box.innerHTML = "";


  cart.forEach(function(item){

    let itemTotal =
      item.price * item.quantity;

    total += itemTotal;


    box.innerHTML += `

      <div class="order-item">

        <span>
          ${item.icon}
          ${item.name}
          × ${item.quantity}
        </span>

        <span>
          ₹${itemTotal.toLocaleString("en-IN")}
        </span>

      </div>

    `;

  });


  document.getElementById("total")
    .innerText =
    total.toLocaleString("en-IN");

}


window.placeOrder = function(){

  let name =
    document.getElementById("name")
      .value.trim();

  let phone =
    document.getElementById("phone")
      .value.trim();

  let address =
    document.getElementById("address")
      .value.trim();

  let city =
    document.getElementById("city")
      .value.trim();

  let pincode =
    document.getElementById("pincode")
      .value.trim();

  let email =
    document.getElementById("email")
      .value.trim();


  if(!name || !phone || !address || !city || !pincode){

    alert(
      "Please fill all required details."
    );

    return;

  }


  if(phone.length !== 10){

    alert(
      "Please enter a valid 10 digit mobile number."
    );

    return;

  }


  if(cart.length === 0){

    alert("Your cart is empty.");

    return;

  }


  let payment =
    document.querySelector(
      'input[name="payment"]:checked'
    ).value;


  let total =
    document.getElementById("total")
      .innerText;


  let products = "";

  cart.forEach(function(item){

    products +=
      item.name +
      " × " +
      item.quantity +
      " = ₹" +
      (item.price * item.quantity)
        .toLocaleString("en-IN") +
      "\n";

  });


  const orderData = {

    name:name,

    phone:phone,

    email:email,

    address:
      address +
      ", " +
      city +
      " - " +
      pincode,

    products:products,

    total:total,

    payment:payment

  };


  const scriptURL =
    "https://script.google.com/macros/s/AKfycbw1cUlqklcnweOY8vpxNJWOZNsunqgrB41xjbn_D2TN5w2pN9rurfgh55APTRLR5DVa/exec";


  fetch(scriptURL,{

    method:"POST",

    body:JSON.stringify(orderData)

  })

  .then(function(response){

    return response.json();

  })

  .then(function(result){

    if(result.success){

      document.getElementById("success")
        .style.display = "block";

      localStorage.removeItem("novaCart");

    }else{

      alert(
        "Order save nahi hua. Please try again."
      );

    }

  })

  .catch(function(error){

    console.error(error);

    alert(
      "Connection error. Please try again."
    );

  });

}


showOrder();

</script>

</body>
</html>
```
