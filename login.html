```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Nova Power Tools</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 20% 20%,#263a59 0,#101827 35%,#050912 75%);
  overflow:hidden;
  color:white;
}

/* Background */

.bg-circle{
  position:fixed;
  border-radius:50%;
  filter:blur(2px);
  opacity:.25;
}

.bg1{
  width:350px;
  height:350px;
  background:#ffb000;
  top:-120px;
  left:-100px;
}

.bg2{
  width:300px;
  height:300px;
  background:#2563eb;
  right:-100px;
  bottom:-100px;
}

/* Main */

.login-scene{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

/* Character area */

.character-area{
  width:330px;
  height:500px;
  position:relative;
  z-index:5;
  animation:characterEnter 2.2s ease forwards;
}

@keyframes characterEnter{

  0%{
    transform:
      translateX(-380px)
      scale(.65);
    opacity:0;
  }

  70%{
    transform:
      translateX(20px)
      scale(1.02);
    opacity:1;
  }

  100%{
    transform:
      translateX(0)
      scale(1);
    opacity:1;
  }
}

/* Stylish 3D-like character */

.character{
  position:absolute;
  left:80px;
  bottom:45px;
  width:170px;
  height:360px;
}

/* Head */

.head{
  position:absolute;
  top:10px;
  left:48px;
  width:82px;
  height:92px;
  border-radius:45% 45% 48% 48%;
  background:linear-gradient(135deg,#f6c7a5,#b86f4d);
  box-shadow:
    inset -12px -8px 20px rgba(0,0,0,.25),
    8px 10px 20px rgba(0,0,0,.3);
  z-index:4;
}

/* Hair */

.hair{
  position:absolute;
  top:3px;
  left:43px;
  width:92px;
  height:42px;
  border-radius:55px 55px 20px 20px;
  background:linear-gradient(135deg,#151515,#000);
  z-index:5;
}

/* Glasses */

.glasses{
  position:absolute;
  top:43px;
  left:43px;
  z-index:8;
  display:flex;
  gap:3px;
}

.glass{
  width:40px;
  height:22px;
  border:3px solid #111;
  background:rgba(20,30,40,.8);
  border-radius:7px;
}

.bridge{
  width:10px;
  height:3px;
  background:#111;
  margin-top:9px;
}

/* Body / Coat */

.body{
  position:absolute;
  top:94px;
  left:25px;
  width:130px;
  height:190px;
  background:
    linear-gradient(90deg,#0a0d14,#303746,#090b11);
  clip-path:polygon(
    30% 0,
    70% 0,
    92% 18%,
    100% 100%,
    0 100%,
    8% 18%
  );
  box-shadow:
    12px 15px 25px rgba(0,0,0,.5);
}

/* Shirt */

.shirt{
  position:absolute;
  top:100px;
  left:72px;
  width:36px;
  height:100px;
  background:#f5f5f5;
  clip-path:polygon(50% 0,100% 30%,75% 100%,25% 100%,0 30%);
  z-index:3;
}

/* Tie */

.tie{
  position:absolute;
  top:105px;
  left:83px;
  width:15px;
  height:90px;
  background:#ffb000;
  clip-path:polygon(
    50% 0,
    100% 20%,
    70% 65%,
    100% 100%,
    50% 90%,
    0 100%,
    30% 65%,
    0 20%
  );
  z-index:5;
}

/* Arms */

.arm{
  position:absolute;
  width:42px;
  height:150px;
  background:linear-gradient(90deg,#090c13,#363c49,#090b10);
  border-radius:25px;
  top:110px;
  z-index:2;
}

.arm-left{
  left:0;
  transform:rotate(12deg);
}

.arm-right{
  right:0;
  transform:rotate(-14deg);
}

/* Legs */

.leg{
  position:absolute;
  top:270px;
  width:48px;
  height:115px;
  background:linear-gradient(90deg,#07090d,#303540,#050609);
  border-radius:8px;
}

.leg-left{
  left:42px;
}

.leg-right{
  right:42px;
}

/* Shoes */

.shoe{
  position:absolute;
  top:370px;
  width:75px;
  height:30px;
  background:#050505;
  border-radius:30px 10px 10px 10px;
  box-shadow:8px 8px 15px rgba(0,0,0,.5);
}

.shoe-left{
  left:18px;
}

.shoe-right{
  right:18px;
}

/* Bag */

.bag{
  position:absolute;
  right:-10px;
  bottom:115px;
  width:75px;
  height:65px;
  background:linear-gradient(135deg,#6d3b1e,#26150d);
  border-radius:12px;
  box-shadow:8px 12px 20px rgba(0,0,0,.5);
  animation:bagMove 2s ease-in-out infinite;
}

.bag-handle{
  position:absolute;
  width:40px;
  height:28px;
  border:6px solid #6d3b1e;
  border-bottom:none;
  border-radius:30px 30px 0 0;
  left:17px;
  top:-24px;
}

@keyframes bagMove{
  0%,100%{transform:rotate(0deg)}
  50%{transform:rotate(4deg)}
}

/* Form */

.login-card{
  width:390px;
  min-height:500px;
  padding:35px;
  border-radius:25px;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(22px);
  box-shadow:
    0 30px 70px rgba(0,0,0,.45),
    inset 0 1px 1px rgba(255,255,255,.2);

  opacity:0;
  transform:
    translateX(180px)
    scale(.7)
    rotateY(-25deg);

  animation:formEnter 1.2s ease 2.2s forwards;
  position:relative;
  z-index:10;
}

@keyframes formEnter{

  0%{
    opacity:0;
    transform:
      translateX(180px)
      scale(.7)
      rotateY(-25deg);
  }

  100%{
    opacity:1;
    transform:
      translateX(0)
      scale(1)
      rotateY(0);
  }
}

.login-card h1{
  text-align:center;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#cbd5e1;
  margin-bottom:25px;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.tabs button{
  flex:1;
  padding:11px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:rgba(255,255,255,.10);
  color:white;
}

.tabs button.active{
  background:#ffb000;
  color:#111;
  font-weight:bold;
}

.input{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(0,0,0,.25);
  color:white;
  outline:none;
}

.input::placeholder{
  color:#b8c0cc;
}

.main-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#ffb000;
  color:#111;
  font-weight:bold;
  cursor:pointer;
  margin-top:5px;
}

.google-btn{
  width:100%;
  padding:13px;
  border:none;
  border-radius:10px;
  background:white;
  color:#222;
  font-weight:bold;
  cursor:pointer;
  margin-top:12px;
}

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:18px 0;
  color:#9ca3af;
}

.divider::before,
.divider::after{
  content:"";
  height:1px;
  background:rgba(255,255,255,.2);
  flex:1;
}

.phone-btn{
  width:100%;
  padding:12px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:10px;
  background:rgba(255,255,255,.08);
  color:white;
  cursor:pointer;
}

.message{
  min-height:22px;
  text-align:center;
  margin-top:12px;
  font-size:14px;
  color:#ffd166;
}

.otp-area{
  display:none;
}

.back-btn{
  background:none;
  border:none;
  color:#ffb000;
  cursor:pointer;
  margin-bottom:15px;
}

@media(max-width:800px){

  body{
    overflow:auto;
  }

  .login-scene{
    padding:30px 15px;
    flex-direction:column;
    gap:10px;
  }

  .character-area{
    transform:scale(.65);
    margin-bottom:-100px;
  }

  .login-card{
    width:100%;
    max-width:390px;
  }
}
</style>
</head>

<body>

<div class="bg-circle bg1"></div>
<div class="bg-circle bg2"></div>

<div class="login-scene">

  <div class="character-area">

    <div class="character">

      <div class="hair"></div>
      <div class="head"></div>

      <div class="glasses">
        <div class="glass"></div>
        <div class="bridge"></div>
        <div class="glass"></div>
      </div>

      <div class="body"></div>
      <div class="shirt"></div>
      <div class="tie"></div>

      <div class="arm arm-left"></div>
      <div class="arm arm-right"></div>

      <div class="leg leg-left"></div>
      <div class="leg leg-right"></div>

      <div class="shoe shoe-left"></div>
      <div class="shoe shoe-right"></div>

      <div class="bag">
        <div class="bag-handle"></div>
      </div>

    </div>

  </div>


  <div class="login-card">

    <h1 id="title">
      Welcome Back
    </h1>

    <p class="subtitle">
      Nova Power Tools
    </p>


    <div class="tabs">

      <button
        id="loginTab"
        class="active"
        onclick="showLogin()">
        Login
      </button>

      <button
        id="signupTab"
        onclick="showSignup()">
        Sign Up
      </button>

    </div>


    <div id="emailArea">

      <input
        class="input"
        id="name"
        placeholder="Full Name"
        style="display:none;"
      >

      <input
        class="input"
        id="email"
        type="email"
        placeholder="Email Address"
      >

      <input
        class="input"
        id="password"
        type="password"
        placeholder="Password"
      >

      <button
        class="main-btn"
        onclick="emailLogin()"
        id="mainBtn">
        Login
      </button>

      <div class="divider">
        OR
      </div>

      <button
        class="google-btn"
        onclick="googleLogin()">
        🔵 Continue with Google
      </button>

      <button
        class="phone-btn"
        onclick="showPhone()">
        📱 Login with Mobile OTP
      </button>

    </div>


    <div id="phoneArea" style="display:none;">

      <button
        class="back-btn"
        onclick="backToEmail()">
        ← Back
      </button>

      <input
        class="input"
        id="phone"
        placeholder="+91 9876543210"
      >

      <div id="recaptcha-container"></div>

      <button
        class="main-btn"
        onclick="sendOTP()">
        Send OTP
      </button>

      <div id="otpArea" class="otp-area">

        <input
          class="input"
          id="otp"
          placeholder="Enter OTP"
          maxlength="6"
        >

        <button
          class="main-btn"
          onclick="verifyOTP()">
          Verify OTP
        </button>

      </div>

    </div>


    <div
      class="message"
      id="message">
    </div>

  </div>

</div>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  RecaptchaVerifier,
  signInWithPhoneNumber
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyAGOZn1c-iWzH3g3OS_TTlh1uz1Ju5gmjw",

  authDomain:
    "nova-power-tools.firebaseapp.com",

  projectId:
    "nova-power-tools",

  storageBucket:
    "nova-power-tools.firebasestorage.app",

  messagingSenderId:
    "265235157417",

  appId:
    "1:265235157417:web:60d630ee374f21b05234b8",

  measurementId:
    "G-PF74PNJQ89"
};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);


let isSignup = false;

let confirmationResult = null;

let recaptchaVerifier = null;


function showMessage(text){

  document.getElementById("message")
    .textContent = text;

}


window.showLogin = function(){

  isSignup = false;

  document.getElementById("title")
    .textContent = "Welcome Back";

  document.getElementById("name")
    .style.display = "none";

  document.getElementById("mainBtn")
    .textContent = "Login";

  document.getElementById("loginTab")
    .classList.add("active");

  document.getElementById("signupTab")
    .classList.remove("active");

  showMessage("");

};


window.showSignup = function(){

  isSignup = true;

  document.getElementById("title")
    .textContent = "Create Account";

  document.getElementById("name")
    .style.display = "block";

  document.getElementById("mainBtn")
    .textContent = "Create Account";

  document.getElementById("signupTab")
    .classList.add("active");

  document.getElementById("loginTab")
    .classList.remove("active");

  showMessage("");

};


window.emailLogin = async function(){

  const name =
    document.getElementById("name").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  if(!email || !password){

    showMessage("Please enter email and password.");

    return;
  }


  try{

    if(isSignup){

      if(!name){

        showMessage("Please enter your name.");

        return;
      }


      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

      showMessage("Account created successfully!");

    }else{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      showMessage("Login successful!");

    }


    setTimeout(function(){

      window.location.href =
        "account.html";

    },800);


  }catch(error){

    console.error(error);

    showMessage(
      error.message
        .replace("Firebase: ","")
    );

  }

};


window.googleLogin = async function(){

  try{

    const provider =
      new GoogleAuthProvider();

    await signInWithPopup(
      auth,
      provider
    );

    showMessage("Google login successful!");

    setTimeout(function(){

      window.location.href =
        "account.html";

    },800);

  }catch(error){

    console.error(error);

    showMessage(
      error.message
        .replace("Firebase: ","")
    );

  }

};


window.showPhone = function(){

  document.getElementById("emailArea")
    .style.display = "none";

  document.getElementById("phoneArea")
    .style.display = "block";

  showMessage("");

};


window.backToEmail = function(){

  document.getElementById("phoneArea")
    .style.display = "none";

  document.getElementById("emailArea")
    .style.display = "block";

  showMessage("");

};


window.sendOTP = async function(){

  const phone =
    document.getElementById("phone")
      .value.trim();


  if(!phone){

    showMessage(
      "Enter your mobile number with country code."
    );

    return;
  }


  try{

    if(!recaptchaVerifier){

      recaptchaVerifier =
        new RecaptchaVerifier(
          auth,
          "recaptcha-container",
          {
            size:"normal"
          }
        );

    }


    confirmationResult =
      await signInWithPhoneNumber(
        auth,
        phone,
        recaptchaVerifier
      );


    document.getElementById("otpArea")
      .style.display = "block";

    showMessage(
      "OTP sent successfully."
    );

  }catch(error){

    console.error(error);

    showMessage(
      error.message
        .replace("Firebase: ","")
    );

  }

};


window.verifyOTP = async function(){

  const otp =
    document.getElementById("otp")
      .value.trim();


  if(!otp){

    showMessage("Enter the OTP.");

    return;
  }


  try{

    await confirmationResult.confirm(
      otp
    );

    showMessage(
      "Login successful!"
    );

    setTimeout(function(){

      window.location.href =
        "account.html";

    },800);

  }catch(error){

    console.error(error);

    showMessage(
      "Invalid OTP. Please try again."
    );

  }

};

</script>

</body>
</html>
```
