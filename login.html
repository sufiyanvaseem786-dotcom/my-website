<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Power Tools - Login</title>

<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 10% 20%, #263d6a 0%, transparent 30%),
    radial-gradient(circle at 85% 80%, #102a5c 0%, transparent 30%),
    linear-gradient(135deg,#07101f,#020611 70%);
  color:white;
  overflow:hidden;
}


/* =========================
   MAIN SCENE
========================= */

.scene{
  min-height:100vh;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:30px;
  padding:30px;
}


/* =========================
   CHARACTER
========================= */

.character-wrap{
  width:430px;
  height:620px;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;

  opacity:0;

  transform:
    translateX(-350px)
    scale(.82);

  animation:
    boyEnter
    1.4s
    cubic-bezier(.18,.89,.32,1.28)
    .2s
    forwards;
}

.character-wrap::before{
  content:"";

  position:absolute;

  width:280px;
  height:70px;

  bottom:65px;

  background:rgba(0,0,0,.45);

  filter:blur(25px);

  border-radius:50%;
}

.character-image{
  position:relative;
  z-index:2;

  width:100%;
  height:100%;

  object-fit:contain;

  filter:
    drop-shadow(0 25px 25px rgba(0,0,0,.45))
    drop-shadow(0 0 18px rgba(255,176,0,.12));

  animation:
    characterFloat
    4s
    ease-in-out
    1.7s
    infinite;
}


/* BOY ENTERS FROM LEFT */

@keyframes boyEnter{

  0%{
    opacity:0;
    transform:
      translateX(-350px)
      scale(.82);
  }

  60%{
    opacity:1;
  }

  100%{
    opacity:1;
    transform:
      translateX(0)
      scale(1);
  }

}


/* SMALL FLOATING EFFECT */

@keyframes characterFloat{

  0%,
  100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-10px);
  }

}


/* =========================
   LOGIN CARD
========================= */

.login-card{

  width:430px;
  min-height:550px;

  padding:30px;

  border-radius:24px;

  background:
    linear-gradient(
      145deg,
      rgba(18,43,83,.92),
      rgba(10,18,36,.94)
    );

  border:1px solid rgba(255,255,255,.18);

  box-shadow:
    0 25px 70px rgba(0,0,0,.55),
    0 0 35px rgba(255,176,0,.10);

  backdrop-filter:blur(18px);

  opacity:0;

  transform:
    translateX(120px)
    scale(.92);

  animation:
    formEnter
    1.1s
    cubic-bezier(.18,.89,.32,1.28)
    .7s
    forwards;

  position:relative;

  overflow:hidden;
}


/* glowing border */

.login-card::before{

  content:"";

  position:absolute;

  inset:-2px;

  border-radius:24px;

  background:
    linear-gradient(
      120deg,
      transparent,
      rgba(0,174,255,.45),
      rgba(255,176,0,.55),
      transparent
    );

  z-index:-1;

  filter:blur(12px);

  opacity:.6;
}


/* FORM ENTER */

@keyframes formEnter{

  0%{
    opacity:0;
    transform:
      translateX(120px)
      scale(.92);
  }

  100%{
    opacity:1;
    transform:
      translateX(0)
      scale(1);
  }

}


/* =========================
   LOGO
========================= */

.logo{

  text-align:center;

  font-size:28px;

  font-weight:800;

  margin-bottom:7px;

  letter-spacing:.3px;
}

.logo:first-letter{
  color:#ffb000;
}

.logo span{
  color:#ffb000;
}

.subtitle{

  text-align:center;

  color:#b8c4d8;

  font-size:14px;

  margin-bottom:24px;
}


/* =========================
   TABS
========================= */

.tabs{

  display:flex;

  background:rgba(0,0,0,.28);

  border:1px solid rgba(255,255,255,.12);

  border-radius:12px;

  padding:4px;

  margin-bottom:18px;
}

.tabs button{

  flex:1;

  border:0;

  padding:12px;

  border-radius:9px;

  background:transparent;

  color:white;

  cursor:pointer;

  font-weight:bold;

  transition:.25s;
}

.tabs button.active{

  background:#ffb000;

  color:#111;

  box-shadow:
    0 0 18px rgba(255,176,0,.3);
}

.tabs button:hover{
  background:rgba(255,176,0,.2);
}


/* =========================
   INPUT
========================= */

.input{

  width:100%;

  padding:14px 15px;

  margin-bottom:12px;

  border-radius:10px;

  border:1px solid rgba(255,255,255,.2);

  background:rgba(4,10,20,.55);

  color:white;

  outline:none;

  font-size:14px;

  transition:.25s;
}

.input::placeholder{
  color:#9ca9bc;
}

.input:focus{

  border-color:#ffb000;

  box-shadow:
    0 0 0 2px rgba(255,176,0,.12),
    0 0 18px rgba(255,176,0,.08);
}


/* =========================
   MAIN BUTTON
========================= */

.main-btn{

  width:100%;

  border:0;

  border-radius:10px;

  padding:14px;

  background:#ffb000;

  color:#111;

  font-size:15px;

  font-weight:800;

  cursor:pointer;

  transition:.25s;

  margin-top:3px;
}

.main-btn:hover{

  transform:translateY(-2px);

  box-shadow:
    0 8px 22px rgba(255,176,0,.28);
}


/* =========================
   DIVIDER
========================= */

.divider{

  display:flex;

  align-items:center;

  gap:12px;

  margin:18px 0;

  color:#8e9aae;

  font-size:12px;
}

.divider::before,
.divider::after{

  content:"";

  flex:1;

  height:1px;

  background:rgba(255,255,255,.16);
}


/* =========================
   GOOGLE
========================= */

.google-btn{

  width:100%;

  padding:13px;

  border:0;

  border-radius:10px;

  background:white;

  color:#222;

  font-weight:bold;

  cursor:pointer;

  transition:.25s;
}

.google-btn:hover{

  transform:translateY(-2px);

  box-shadow:
    0 8px 20px rgba(0,0,0,.25);
}


/* =========================
   PHONE
========================= */

.phone-btn{

  width:100%;

  margin-top:10px;

  padding:13px;

  border-radius:10px;

  border:1px solid rgba(255,255,255,.2);

  background:rgba(255,255,255,.07);

  color:white;

  cursor:pointer;

  font-weight:bold;

  transition:.25s;
}

.phone-btn:hover{

  background:rgba(255,176,0,.15);

  border-color:#ffb000;
}


/* =========================
   PHONE AREA
========================= */

.phone-area{

  display:none;
}

.otp-area{

  display:none;

  margin-top:10px;
}

.back-btn{

  background:transparent;

  border:0;

  color:#ffb000;

  cursor:pointer;

  margin-bottom:15px;

  font-size:13px;
}


/* =========================
   MESSAGE
========================= */

.message{

  min-height:22px;

  margin-top:15px;

  text-align:center;

  color:#ffcf55;

  font-size:13px;

  line-height:1.4;
}


/* =========================
   SECURITY
========================= */

.security{

  text-align:center;

  color:#7f8da3;

  font-size:11px;

  margin-top:20px;
}


/* =========================
   DECORATION
========================= */

.scene::before{

  content:"";

  position:fixed;

  width:180px;
  height:180px;

  border-radius:50%;

  background:rgba(255,176,0,.16);

  top:-70px;
  left:-70px;

  filter:blur(5px);
}

.scene::after{

  content:"";

  position:fixed;

  width:150px;
  height:150px;

  border-radius:50%;

  background:rgba(30,90,255,.18);

  bottom:-70px;
  right:-50px;

  filter:blur(5px);
}


/* =========================
   MOBILE
========================= */

@media(max-width:850px){

  body{
    overflow:auto;
  }

  .scene{

    min-height:100vh;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    gap:5px;

    padding:20px 12px;
  }

  .character-wrap{

    width:280px;

    height:320px;

    margin-bottom:-15px;

    transform:
      translateX(-180px)
      scale(.85);

    animation:
      boyEnterMobile
      1.2s
      cubic-bezier(.18,.89,.32,1.28)
      .1s
      forwards;
  }

  @keyframes boyEnterMobile{

    0%{
      opacity:0;
      transform:
        translateX(-180px)
        scale(.75);
    }

    60%{
      opacity:1;
    }

    100%{
      opacity:1;
      transform:
        translateX(0)
        scale(.85);
    }
  }

  .login-card{

    width:100%;

    max-width:420px;

    min-height:auto;

    padding:24px 20px;

    transform:
      translateY(80px)
      scale(.95);

    animation:
      formEnterMobile
      1s
      ease
      .6s
      forwards;
  }

  @keyframes formEnterMobile{

    0%{
      opacity:0;
      transform:
        translateY(80px)
        scale(.95);
    }

    100%{
      opacity:1;
      transform:
        translateY(0)
        scale(1);
    }
  }

  .logo{
    font-size:24px;
  }

}


/* SMALL PHONE */

@media(max-width:450px){

  .character-wrap{

    width:230px;

    height:260px;

    margin-bottom:-5px;
  }

  .login-card{

    padding:20px 16px;

    border-radius:18px;
  }

  .logo{
    font-size:22px;
  }

}

</style>

</head>


<body>


<div class="scene">


  <!-- =========================
       3D BOY
  ========================== -->

  <div class="character-wrap">

    <img
      src="login-character.png"
      class="character-image"
      alt="Nova Power Tools Character"
    >

  </div>


  <!-- =========================
       LOGIN CARD
  ========================== -->

  <div class="login-card">


    <div class="logo">

      ⚡ Nova <span>Power Tools</span>

    </div>


    <div class="subtitle">

      Welcome to Nova Power Tools

    </div>


    <!-- LOGIN / SIGN UP -->

    <div class="tabs">

      <button
        id="loginTab"
        class="active"
        onclick="showLogin()"
      >
        Login
      </button>


      <button
        id="signupTab"
        onclick="showSignup()"
      >
        Sign Up
      </button>

    </div>


    <!-- EMAIL AREA -->

    <div id="emailArea">


      <input
        class="input"
        id="name"
        placeholder="Full Name"
        style="display:none;"
      >


      <input
        class="input"
        id="email"
        type="email"
        placeholder="Email Address"
      >


      <input
        class="input"
        id="password"
        type="password"
        placeholder="Password"
      >
       <!-- TERMS & PRIVACY -->
<div
  id="termsArea"
  style="display:none; margin:8px 0 14px; font-size:12px; color:#b8c4d8; line-height:1.5;"
>
  <label style="display:flex; align-items:flex-start; gap:8px; cursor:pointer;">

    <input
      type="checkbox"
      id="termsCheckbox"
      style="margin-top:3px;"
    >

    <span>
      I agree to the
      <a href="terms.html" target="_blank" style="color:#ffb000;">
        Terms & Conditions
      </a>
      and
      <a href="privacy.html" target="_blank" style="color:#ffb000;">
        Privacy Policy
      </a>.
    </span>

  </label>
</div>


      <button
        class="main-btn"
        id="mainBtn"
        onclick="emailLogin()"
      >
        Login
      </button>


      <div class="divider">
        OR
      </div>


      <button
        class="google-btn"
        onclick="googleLogin()"
      >
        🔵 Continue with Google
      </button>


      <button
        class="phone-btn"
        onclick="showPhone()"
      >
        📱 Login with Mobile OTP
      </button>


    </div>


    <!-- PHONE OTP AREA -->

    <div
      class="phone-area"
      id="phoneArea"
    >


      <button
        class="back-btn"
        onclick="backToEmail()"
      >
        ← Back to Login
      </button>


      <input
        class="input"
        id="phone"
        placeholder="+91 9876543210"
      >


      <div id="recaptcha-container"></div>


      <button
        class="main-btn"
        onclick="sendOTP()"
      >
        Send OTP
      </button>


      <div
        class="otp-area"
        id="otpArea"
      >


        <input
          class="input"
          id="otp"
          maxlength="6"
          inputmode="numeric"
          placeholder="Enter 6-digit OTP"
        >


        <button
          class="main-btn"
          onclick="verifyOTP()"
        >
          Verify OTP
        </button>


      </div>


    </div>


    <!-- MESSAGE -->

    <div
      class="message"
      id="message"
    ></div>


    <div class="security">

      🔒 Your account is secured by Firebase Authentication

    </div>


  </div>

</div>



<!-- =========================
     FIREBASE
========================== -->

<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  RecaptchaVerifier,
  signInWithPhoneNumber
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";



/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey:
    "AIzaSyAGOZn1c-iWzH3g3OS_TTlh1uz1Ju5gmjw",

  authDomain:
    "nova-power-tools.firebaseapp.com",

  projectId:
    "nova-power-tools",

  storageBucket:
    "nova-power-tools.firebasestorage.app",

  messagingSenderId:
    "265235157417",

  appId:
    "1:265235157417:web:60d630ee374f21b05234b8",

  measurementId:
    "G-PF74PNJQ89"

};



/* INITIALIZE */

const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);



/* =========================
   RETURN PAGE
========================= */

const requestedReturn =
  new URLSearchParams(
    window.location.search
  ).get("returnUrl");


const allowedReturnPages = [

  "checkout.html",

  "account.html"

];


const returnUrl =
  allowedReturnPages.includes(requestedReturn)
    ? requestedReturn
    : "account.html";



/* =========================
   VARIABLES
========================= */

let isSignup = false;

let confirmationResult = null;

let recaptchaVerifier = null;



/* =========================
   MESSAGE
========================= */

function showMessage(text){

  document
    .getElementById("message")
    .textContent = text;

}



/* =========================
   LOGIN TAB
========================= */

window.showLogin = function(){

  isSignup = false;


  document
    .getElementById("name")
    .style.display = "none";
   
   document
  .getElementById("termsArea")
  .style.display = "none";

document
  .getElementById("termsCheckbox")
  .checked = false;


  document
    .getElementById("mainBtn")
    .textContent = "Login";


  document
    .getElementById("loginTab")
    .classList.add("active");


  document
    .getElementById("signupTab")
    .classList.remove("active");


  showMessage("");

};



/* =========================
   SIGNUP TAB
========================= */

window.showSignup = function(){

  isSignup = true;


  document
    .getElementById("name")
    .style.display = "block";


  document
    .getElementById("mainBtn")
    .textContent = "Create Account";


  document
    .getElementById("signupTab")
    .classList.add("active");


  document
    .getElementById("loginTab")
    .classList.remove("active");


  showMessage("");

};



/* =========================
   AFTER LOGIN
========================= */

function goAfterLogin(){

  showMessage(
    "✅ Login successful! Redirecting..."
  );


  setTimeout(function(){

    window.location.href =
      returnUrl;

  },800);

}



/* =========================
   EMAIL LOGIN / SIGNUP
========================= */

window.emailLogin = async function(){


  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value;


  if(!email || !password){

    showMessage(
      "Please enter email and password."
    );

    return;

  }


  if(isSignup && !name){

    showMessage(
      "Please enter your full name."
    );

    return;

  }
   if(isSignup){ const termsAccepted = document .getElementById("termsCheckbox") .checked; if(!termsAccepted){ showMessage( "Please accept the Terms & Conditions and Privacy Policy." ); return; } }


  if(isSignup && password.length < 6){

    showMessage(
      "Password must contain at least 6 characters."
    );

    return;

  }


  try{


    if(isSignup){

      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    }else{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }


    goAfterLogin();


  }catch(error){

    console.error(error);


    showMessage(
      error.message
        .replace("Firebase: ","")
    );

  }

};



/* =========================
   GOOGLE LOGIN
========================= */

window.googleLogin = async function(){

  try{

    const provider =
      new GoogleAuthProvider();


    await signInWithPopup(
      auth,
      provider
    );


    goAfterLogin();


  }catch(error){

    console.error(error);


    showMessage(
      error.message
        .replace("Firebase: ","")
    );

  }

};



/* =========================
   SHOW PHONE LOGIN
========================= */

window.showPhone = function(){

  document
    .getElementById("emailArea")
    .style.display = "none";


  document
    .getElementById("phoneArea")
    .style.display = "block";


  showMessage("");

};



/* =========================
   BACK TO EMAIL
========================= */

window.backToEmail = function(){

  document
    .getElementById("phoneArea")
    .style.display = "none";


  document
    .getElementById("emailArea")
    .style.display = "block";


  document
    .getElementById("otpArea")
    .style.display = "none";


  showMessage("");

};



/* =========================
   SEND OTP
========================= */

window.sendOTP = async function(){


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  if(!phone){

    showMessage(
      "Enter your mobile number with country code."
    );

    return;

  }


  try{


    if(!recaptchaVerifier){

      recaptchaVerifier =
        new RecaptchaVerifier(
          auth,
          "recaptcha-container",
          {
            size:"normal"
          }
        );

    }


    confirmationResult =
      await signInWithPhoneNumber(
        auth,
        phone,
        recaptchaVerifier
      );


    document
      .getElementById("otpArea")
      .style.display = "block";


    showMessage(
      "📱 OTP sent successfully."
    );


  }catch(error){

    console.error(error);


    showMessage(
      error.message
        .replace("Firebase: ","")
    );

  }

};



/* =========================
   VERIFY OTP
========================= */

window.verifyOTP = async function(){


  const otp =
    document
      .getElementById("otp")
      .value
      .trim();


  if(!confirmationResult){

    showMessage(
      "Please request an OTP first."
    );

    return;

  }


  if(!otp){

    showMessage(
      "Enter the OTP."
    );

    return;

  }


  try{


    await confirmationResult.confirm(
      otp
    );


    goAfterLogin();


  }catch(error){

    console.error(error);


    showMessage(
      "❌ Invalid OTP. Please try again."
    );

  }

};



/* =========================
   DEFAULT SIGN UP
========================= */

showSignup();
   document .getElementById("termsArea") .style.display = "block";

</script>

</body>
</html>
