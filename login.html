<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Power Tools — Login</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 20% 20%,#172d59,#07101f 45%,#02050b);
  color:white;
}

/* BACKGROUND */

.bg-glow{
  position:fixed;
  width:450px;
  height:450px;
  border-radius:50%;
  filter:blur(100px);
  opacity:.22;
  pointer-events:none;
}

.glow1{
  background:#ffb000;
  left:-180px;
  top:-180px;
}

.glow2{
  background:#1769ff;
  right:-180px;
  bottom:-180px;
}


/* MAIN SCENE */

.scene{
  width:100%;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
  perspective:1400px;
  padding:20px;
}
/* CHARACTER FRAME */
/* ===== CINEMATIC CHARACTER ENTRANCE ===== */
.character-wrap{
  width:390px;
  height:560px;
  position:relative;
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  opacity:0;

  transform:translateX(-500px) scale(.75);

  animation:
    boyEnter
    2.5s
    cubic-bezier(.16,1,.3,1)
    forwards;
}

.character-image{
  width:100%;
  height:100%;

  object-fit:contain;

  display:block;

  position:relative;
  z-index:5;

  filter:
    drop-shadow(0 25px 25px rgba(0,0,0,.55));

  animation:
    boyPose
    5s
    ease-in-out
    2.3s
    forwards;
}


@keyframes boyEnter{

  0%{
    opacity:0;
    transform:
      translateX(-500px)
      scale(.7);
  }

  60%{
    opacity:1;
    transform:
      translateX(-80px)
      scale(.9);
  }

  85%{
    transform:
      translateX(15px)
      scale(1.02);
  }

  100%{
    opacity:1;
    transform:
      translateX(0)
      scale(1);
  }
}


@keyframes boyPose{

  0%{
    transform:translateX(0);
  }

  20%{
    transform:translateX(15px);
  }

  40%{
    transform:translateX(-12px);
  }

  60%{
    transform:translateX(0);
  }

  72%{
    transform:translateX(-18px) scale(.98);
  }

  82%{
    transform:translateX(-30px) scale(.95);
  }

  100%{
    transform:translateX(-25px) scale(.96);
  }
}
/* ===== FORM ENTERS AFTER CHARACTER ===== */
.login-card{

  animation:
    formCinematicEntrance
    1.5s
    cubic-bezier(.16,1,.3,1)
    3.1s
    forwards;

}


@keyframes formCinematicEntrance{

  0%{

    opacity:0;

    transform:
      translateX(300px)
      scale(.55)
      rotateY(-38deg);

    filter:
      blur(12px);
  }

  45%{

    opacity:1;

    transform:
      translateX(-20px)
      scale(1.04)
      rotateY(6deg);

    filter:
      blur(0);
  }

  70%{

    transform:
      translateX(8px)
      scale(.98)
      rotateY(-2deg);
  }

  100%{

    opacity:1;

    transform:
      translateX(0)
      scale(1)
      rotateY(0);

    filter:
      blur(0);
  }

}


/* GOLD LIGHT WHEN FORM APPEARS */

.login-card::after{

  content:"";

  position:absolute;

  width:180px;
  height:180px;

  border-radius:50%;

  background:#ffb000;

  filter:blur(90px);

  opacity:0;

  left:-80px;
  top:50%;

  pointer-events:none;

  animation:
    formLight
    1.2s
    ease
    3.2s
    forwards;

}


@keyframes formLight{

  0%{
    opacity:0;
    transform:scale(.5);
  }

  40%{
    opacity:.25;
    transform:scale(1.2);
  }

  100%{
    opacity:0;
    transform:scale(1.5);
  }

}


/* MOBILE */
{
  
  .character-wrap{

    width:320px;
    height:330px;

    margin-bottom:-35px;

    transform:
      translateX(-450px)
      scale(.65);

  }

  @keyframes characterEntrance{

    0%{
      opacity:0;
      transform:
        translateX(-450px)
        scale(.65);
    }

    70%{
      opacity:1;
      transform:
        translateX(10px)
        scale(.9);
    }

    100%{
      opacity:1;
      transform:
        translateX(0)
        scale(.9);
    }

  }

}
/* LOGIN CARD */

.login-card{

  width:410px;
  min-height:520px;
  padding:32px;

  border-radius:28px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.16),
      rgba(255,255,255,.055)
    );

  border:1px solid rgba(255,255,255,.25);

  backdrop-filter:blur(24px);

  box-shadow:
    0 35px 90px rgba(0,0,0,.6),
    inset 0 1px 1px rgba(255,255,255,.2);

  opacity:0;

  transform:
    translateX(280px)
    scale(.65)
    rotateY(-35deg);

  animation:
    formEmergence 1.35s cubic-bezier(.16,1,.3,1)
    3.15s forwards;

  position:relative;
  z-index:10;
}


.login-card::before{

  content:"";

  position:absolute;

  inset:-2px;

  border-radius:30px;

  background:
    linear-gradient(
      120deg,
      transparent,
      rgba(0,170,255,.7),
      rgba(255,176,0,.8),
      transparent
    );

  z-index:-1;

  filter:blur(5px);

  opacity:.75;

}


@keyframes formEmergence{

  0%{
    opacity:0;

    transform:
      translateX(280px)
      scale(.55)
      rotateY(-35deg);
  }

  65%{
    opacity:1;

    transform:
      translateX(-15px)
      scale(1.03)
      rotateY(5deg);
  }

  100%{
    opacity:1;

    transform:
      translateX(0)
      scale(1)
      rotateY(0);
  }

}


/* LOGO */

.logo{

  text-align:center;
  font-size:30px;
  font-weight:bold;
  margin-bottom:5px;

}

.logo span{
  color:#ffb000;
}

.subtitle{

  text-align:center;
  color:#cbd5e1;
  margin-bottom:25px;

}


/* TABS */

.tabs{

  display:flex;
  gap:8px;
  padding:5px;

  background:rgba(0,0,0,.2);

  border-radius:13px;

  margin-bottom:20px;

}

.tabs button{

  flex:1;

  border:none;

  padding:12px;

  border-radius:10px;

  background:transparent;

  color:white;

  cursor:pointer;

  font-weight:bold;

}

.tabs button.active{

  background:#ffb000;
  color:#111;

  box-shadow:
    0 5px 18px rgba(255,176,0,.3);

}


/* INPUTS */

.input{

  width:100%;

  padding:14px;

  margin-bottom:12px;

  border-radius:11px;

  border:1px solid rgba(255,255,255,.18);

  background:rgba(0,0,0,.28);

  color:white;

  outline:none;

  font-size:15px;

  transition:.25s;

}

.input:focus{

  border-color:#ffb000;

  box-shadow:
    0 0 0 3px rgba(255,176,0,.12);

}

.input::placeholder{
  color:#aeb8c7;
}


/* BUTTONS */

.main-btn{

  width:100%;

  padding:14px;

  border:none;

  border-radius:11px;

  background:#ffb000;

  color:#111;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

  transition:.2s;

}

.main-btn:hover{

  transform:translateY(-2px);

  box-shadow:
    0 10px 25px rgba(255,176,0,.25);

}


.google-btn{

  width:100%;

  padding:13px;

  border:none;

  border-radius:11px;

  background:white;

  color:#222;

  font-weight:bold;

  cursor:pointer;

  transition:.2s;

}

.google-btn:hover{
  transform:translateY(-2px);
}


.phone-btn{

  width:100%;

  padding:12px;

  margin-top:10px;

  border-radius:11px;

  border:1px solid rgba(255,255,255,.2);

  background:rgba(255,255,255,.08);

  color:white;

  cursor:pointer;

}


/* DIVIDER */

.divider{

  display:flex;

  align-items:center;

  gap:10px;

  margin:18px 0;

  color:#94a3b8;

  font-size:13px;

}

.divider::before,
.divider::after{

  content:"";

  flex:1;

  height:1px;

  background:rgba(255,255,255,.2);

}


/* PHONE */

.phone-area{

  display:none;

}

.back-btn{

  border:none;

  background:none;

  color:#ffb000;

  cursor:pointer;

  margin-bottom:15px;

  font-size:14px;

}

.otp-area{
  display:none;
}


/* MESSAGE */

.message{

  min-height:22px;

  margin-top:12px;

  text-align:center;

  color:#ffd166;

  font-size:13px;

}


/* SMALL SECURITY TEXT */

.security{

  text-align:center;

  color:#94a3b8;

  font-size:11px;

  margin-top:18px;

}


/* MOBILE */
  body{
    overflow:auto;
  }

  .scene{

    flex-direction:column;

    padding:20px 12px;

    gap:0;

  }

  .character-wrap{

    width:330px;
    height:330px;

    margin-bottom:-50px;

    transform:
      translateX(-400px)
      scale(.55);

  }

  .login-card{

    width:100%;

    max-width:400px;

    min-height:auto;

    animation:
      formEmergenceMobile
      1.2s ease
      2.8s
      forwards;

  }

}


@keyframes formEmergenceMobile{

  from{

    opacity:0;

    transform:
      translateY(120px)
      scale(.75);

  }

  to{

    opacity:1;

    transform:
      translateY(0)
      scale(1);

  }

}

</style>
</head>


<body>

<div class="bg-glow glow1"></div>
<div class="bg-glow glow2"></div>


<div class="scene">


  <!-- CHARACTER -->
<!-- CHARACTER -->
<div class="character-wrap">
  <img
    src="login-character.png"
    class="character-image"
    alt="Nova Power Tools Character">
</div>


  <!-- LOGIN -->

  <div class="login-card">

    <div class="logo">
      ⚡ Nova <span>Power Tools</span>
    </div>

    <div class="subtitle">
      Welcome to Nova Power Tools
    </div>


    <!-- LOGIN / SIGNUP -->

    <div class="tabs">

      <button
        id="loginTab"
        class="active"
        onclick="showLogin()">

        Login

      </button>

      <button
        id="signupTab"
        onclick="showSignup()">

        Sign Up

      </button>

    </div>


    <div id="emailArea">

      <input
        class="input"
        id="name"
        placeholder="Full Name"
        style="display:none;"
      >

      <input
        class="input"
        id="email"
        type="email"
        placeholder="Email Address"
      >

      <input
        class="input"
        id="password"
        type="password"
        placeholder="Password"
      >

      <button
        class="main-btn"
        id="mainBtn"
        onclick="emailLogin()">

        Login

      </button>


      <div class="divider">
        OR
      </div>


      <button
        class="google-btn"
        onclick="googleLogin()">

        🔵 Continue with Google

      </button>


      <button
        class="phone-btn"
        onclick="showPhone()">

        📱 Login with Mobile OTP

      </button>

    </div>


    <!-- PHONE OTP -->

    <div
      class="phone-area"
      id="phoneArea">

      <button
        class="back-btn"
        onclick="backToEmail()">

        ← Back to Login

      </button>


      <input
        class="input"
        id="phone"
        placeholder="+91 9876543210"
      >


      <div id="recaptcha-container"></div>


      <button
        class="main-btn"
        onclick="sendOTP()">

        Send OTP

      </button>


      <div
        class="otp-area"
        id="otpArea">

        <input
          class="input"
          id="otp"
          maxlength="6"
          placeholder="Enter 6-digit OTP"
        >

        <button
          class="main-btn"
          onclick="verifyOTP()">

          Verify OTP

        </button>

      </div>

    </div>


    <div
      class="message"
      id="message">
    </div>


    <div class="security">

      🔒 Your account is secured by Firebase Authentication

    </div>

  </div>

</div>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  RecaptchaVerifier,
  signInWithPhoneNumber
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyAGOZn1c-iWzH3g3OS_TTlh1uz1Ju5gmjw",

  authDomain:
    "nova-power-tools.firebaseapp.com",

  projectId:
    "nova-power-tools",

  storageBucket:
    "nova-power-tools.firebasestorage.app",

  messagingSenderId:
    "265235157417",

  appId:
    "1:265235157417:web:60d630ee374f21b05234b8",

  measurementId:
    "G-PF74PNJQ89"

};


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


/*
  If checkout sent the customer here,
  return to checkout after login.

  Otherwise go to account.
*/

const requestedReturn =
  new URLSearchParams(
    window.location.search
  ).get("returnUrl");


const allowedReturnPages = [
  "checkout.html",
  "account.html"
];


const returnUrl =
  allowedReturnPages.includes(requestedReturn)
    ? requestedReturn
    : "account.html";


let isSignup = false;

let confirmationResult = null;

let recaptchaVerifier = null;


function showMessage(text){

  document
    .getElementById("message")
    .textContent = text;

}


window.showLogin = function(){

  isSignup = false;

  document
    .getElementById("name")
    .style.display = "none";

  document
    .getElementById("mainBtn")
    .textContent = "Login";

  document
    .getElementById("loginTab")
    .classList.add("active");

  document
    .getElementById("signupTab")
    .classList.remove("active");

  showMessage("");

};


window.showSignup = function(){

  isSignup = true;

  document
    .getElementById("name")
    .style.display = "block";

  document
    .getElementById("mainBtn")
    .textContent = "Create Account";

  document
    .getElementById("signupTab")
    .classList.add("active");

  document
    .getElementById("loginTab")
    .classList.remove("active");

  showMessage("");

};


function goAfterLogin(){

  showMessage(
    "✅ Login successful!"
  );

  setTimeout(function(){

    window.location.href =
      returnUrl;

  },700);

}


window.emailLogin = async function(){

  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value;


  if(!email || !password){

    showMessage(
      "Please enter email and password."
    );

    return;

  }


  if(isSignup && !name){

    showMessage(
      "Please enter your full name."
    );

    return;

  }


  try{

    if(isSignup){

      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    }else{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }


    goAfterLogin();


  }catch(error){

    console.error(error);

    showMessage(
      error.message
        .replace("Firebase: ","")
    );

  }

};


window.googleLogin = async function(){

  try{

    const provider =
      new GoogleAuthProvider();


    await signInWithPopup(
      auth,
      provider
    );


    goAfterLogin();


  }catch(error){

    console.error(error);

    showMessage(
      error.message
        .replace("Firebase: ","")
    );

  }

};


window.showPhone = function(){

  document
    .getElementById("emailArea")
    .style.display = "none";


  document
    .getElementById("phoneArea")
    .style.display = "block";


  showMessage("");

};


window.backToEmail = function(){

  document
    .getElementById("phoneArea")
    .style.display = "none";


  document
    .getElementById("emailArea")
    .style.display = "block";


  showMessage("");

};


window.sendOTP = async function(){

  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  if(!phone){

    showMessage(
      "Enter your mobile number with country code."
    );

    return;

  }


  try{

    if(!recaptchaVerifier){

      recaptchaVerifier =
        new RecaptchaVerifier(
          auth,
          "recaptcha-container",
          {
            size:"normal"
          }
        );

    }


    confirmationResult =
      await signInWithPhoneNumber(
        auth,
        phone,
        recaptchaVerifier
      );


    document
      .getElementById("otpArea")
      .style.display = "block";


    showMessage(
      "📱 OTP sent successfully."
    );


  }catch(error){

    console.error(error);

    showMessage(
      error.message
        .replace("Firebase: ","")
    );

  }

};


window.verifyOTP = async function(){

  const otp =
    document
      .getElementById("otp")
      .value
      .trim();


  if(!confirmationResult){

    showMessage(
      "Please request an OTP first."
    );

    return;

  }


  if(!otp){

    showMessage(
      "Enter the OTP."
    );

    return;

  }


  try{

    await confirmationResult.confirm(
      otp
    );


    goAfterLogin();


  }catch(error){

    console.error(error);

    showMessage(
      "❌ Invalid OTP. Please try again."
    );

  }

};

</script>

</body>
</html>
